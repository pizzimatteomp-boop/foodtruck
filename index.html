<title>VegMan · Planner</title>
<link rel="manifest" href="data:application/manifest+json,{&quot;name&quot;:&quot;VegMan Planner&quot;,&quot;short_name&quot;:&quot;VegMan&quot;,&quot;start_url&quot;:&quot;.&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;%23F6F3EA&quot;,&quot;theme_color&quot;:&quot;%236B77B7&quot;,&quot;icons&quot;:[{&quot;src&quot;:&quot;data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%236B77B7'/%3E%3Cpath fill='%23fff' fill-rule='evenodd' d='M30,28 L70,28 L60,74 L40,74 Z M43,27 C42,38 44,52 50,64 C56,52 58,38 57,27 Z'/%3E%3Cellipse cx='50' cy='18' rx='8' ry='10' fill='%23fff'/%3E%3Cellipse cx='40' cy='23' rx='6.5' ry='8' fill='%23fff'/%3E%3Cellipse cx='60' cy='23' rx='6.5' ry='8' fill='%23fff'/%3E%3C/svg%3E&quot;,&quot;sizes&quot;:&quot;512x512&quot;,&quot;type&quot;:&quot;image/svg+xml&quot;}]}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%236B77B7'/%3E%3Cpath fill='%23fff' fill-rule='evenodd' d='M30,28 L70,28 L60,74 L40,74 Z M43,27 C42,38 44,52 50,64 C56,52 58,38 57,27 Z'/%3E%3Cellipse cx='50' cy='18' rx='8' ry='10' fill='%23fff'/%3E%3Cellipse cx='40' cy='23' rx='6.5' ry='8' fill='%23fff'/%3E%3Cellipse cx='60' cy='23' rx='6.5' ry='8' fill='%23fff'/%3E%3C/svg%3E">

<style>
:root{
  --bg:#F6F3EA;
  --surface:#FFFFFF;
  --surface-2:#F1EDE0;
  --ink:#1C1A22;
  --ink-soft:#615C6C;
  --ink-faint:#9C97A6;
  --line:#E7E1D2;
  --accent:#6B77B7;
  --accent-press:#565F97;
  --accent-soft:#E7E9F5;
  --orange:#F08A39;
  --orange-press:#C46A22;
  --orange-soft:#FCE9D6;
  --pos:#2F7D63;
  --pos-soft:#DFF0EA;
  --neg:#B7426F;
  --neg-soft:#F7E5EC;
  --warn:#C46A22;
  --warn-soft:#FCE9D6;
  --truck:#2F7D63;
  --truck-soft:#DFF0EA;
  --van:#565F97;
  --van-soft:#E7E9F5;
  --shadow:0 1px 2px rgba(28,26,34,.06),0 6px 18px rgba(28,26,34,.07);
  --sans:'Poppins',system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --display:'Baloo 2',var(--sans);
  --maxw:560px;
  --navh:64px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
  height:100vh;height:100dvh;
  overflow:hidden;
}
#app{
  flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  max-width:var(--maxw);width:100%;margin:0 auto;padding:0 14px;
}
h1,h2,h3,p{margin:0}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}
a{color:inherit}

.header{
  position:sticky;top:0;z-index:20;
  background:rgba(246,243,234,.92);backdrop-filter:blur(8px);
  padding:calc(var(--safe-t) + 12px) 0 10px 0;
  display:flex;align-items:center;gap:8px;
  border-bottom:1px solid var(--line);
  margin-bottom:14px;
}
.header-inner{max-width:var(--maxw);margin:0 auto;padding:0 14px;display:flex;align-items:center;gap:8px;width:100%}
.header h1{font-family:var(--display);font-size:21px;font-weight:800;flex:1;letter-spacing:0}
.brandmark{width:38px;height:38px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--accent);box-shadow:var(--shadow)}
.brandmark svg{width:22px;height:22px;display:block}
.iconbtn{
  width:38px;height:38px;border-radius:12px;border:none;background:var(--surface-2);
  color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:18px;
  box-shadow:var(--shadow);flex-shrink:0;
}
.iconbtn:active{transform:scale(.95)}
.iconbtn.primary{background:var(--accent);color:#fff}

.nav{
  flex:0 0 auto;
  background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:var(--safe-b);
}
.nav-inner{max-width:var(--maxw);margin:0 auto;display:flex;height:var(--navh)}
.nav-btn{
  flex:1;border:none;background:none;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;color:var(--ink-faint);
  font-size:11px;font-weight:600;
}
.nav-btn .ic{font-size:20px}
.nav-btn.active{color:var(--accent)}

.card{
  background:var(--surface);border-radius:16px;padding:14px 16px;
  box-shadow:var(--shadow);margin-bottom:10px;
}
.card.tap{cursor:pointer}
.card.tap:active{transform:scale(.99)}
.section-title{
  font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;
  color:var(--ink-soft);margin:18px 2px 8px 2px;
}
.section-title:first-child{margin-top:2px}

.empty{
  text-align:center;padding:48px 20px;color:var(--ink-soft);
}
.empty .emoji{font-size:40px;display:block;margin-bottom:10px}
.empty p{margin-bottom:16px;font-size:14px}

.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--ink-soft);font-size:13px}
.faint{color:var(--ink-faint);font-size:12px}
.strong{font-family:var(--display);font-weight:700}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.badge{
  display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;
  padding:3px 8px;border-radius:100px;background:var(--surface-2);color:var(--ink-soft);
  white-space:nowrap;
}
.badge.accent{background:var(--accent-soft);color:var(--accent-press)}
.badge.pos{background:var(--pos-soft);color:var(--pos)}
.badge.neg{background:var(--neg-soft);color:var(--neg)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.truck{background:var(--truck-soft);color:var(--truck)}
.badge.van{background:var(--van-soft);color:var(--van)}

.btn{
  border:none;border-radius:13px;padding:13px 18px;font-weight:700;font-size:15.5px;font-family:var(--display);
  background:var(--surface-2);color:var(--ink);width:100%;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{background:var(--neg-soft);color:var(--neg)}
.btn.ghost{background:none;box-shadow:none;color:var(--ink-soft)}
.btn.small{width:auto;padding:9px 14px;font-size:13px;border-radius:10px}
.btn-row{display:flex;gap:8px;margin-top:14px}
.btn-row .btn{flex:1}

.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:6px}
.field input[type=text],
.field input[type=number],
.field input[type=date],
.field select,
.field textarea{
  width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;
  padding:12px 13px;color:var(--ink);font-size:15px;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
.field .hint{font-size:12px;color:var(--ink-faint);margin-top:5px}
.field-row{display:flex;gap:10px}
.field-row .field{flex:1}

.check-item{
  display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);
}
.check-item:last-child{border-bottom:none}
.check-item input[type=checkbox]{width:22px;height:22px;flex-shrink:0;accent-color:var(--accent)}
.check-item.done .item-name{text-decoration:line-through;color:var(--ink-faint)}
.item-name{font-family:var(--display);font-weight:700;font-size:15.5px}
.item-sub{font-size:12px;color:var(--ink-soft)}

table.plan{width:100%;border-collapse:collapse;font-size:13.5px}
table.plan th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--ink-faint);padding:0 6px 8px 6px;font-weight:700}
table.plan td{padding:9px 6px;border-top:1px solid var(--line)}
table.plan td.num{text-align:right;font-variant-numeric:tabular-nums}

.menu-pick{border-bottom:1px solid var(--line);padding:12px 2px}
.menu-pick:last-child{border-bottom:none}
.menu-pick .row{gap:10px}
.menu-pick input[type=checkbox]{width:22px;height:22px;flex-shrink:0;accent-color:var(--accent)}
.pct-input{width:64px;text-align:right;border:1.5px solid var(--line);border-radius:8px;padding:6px 7px;font-size:13px}
.pct-live{font-size:12px;color:var(--ink-soft);margin-top:4px;padding-left:34px}

.recipe-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.recipe-row select{flex:2;min-width:0}
.recipe-row input{flex:1;min-width:0}
.recipe-row .unit{width:38px;font-size:12px;color:var(--ink-soft);text-align:center;flex-shrink:0}
.recipe-row .rm{width:34px;height:34px;flex-shrink:0;border:none;background:var(--neg-soft);color:var(--neg);border-radius:9px;font-size:16px}

.article-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.article-chip{
  background:var(--surface);border:1.5px solid var(--line);border-radius:12px;
  padding:10px 14px;box-shadow:var(--shadow);text-align:left;flex:1 1 auto;min-width:110px;
}
.article-chip:active{transform:scale(.96)}
.article-chip .name{font-family:var(--display);font-weight:700;font-size:14px}
.article-chip .price{font-size:12px;color:var(--ink-soft);margin-top:2px}

.cart-row{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.cart-row:last-child{border-bottom:none}
.qty-stepper{display:flex;align-items:center;gap:6px;flex-shrink:0}
.qty-stepper button{width:28px;height:28px;border-radius:8px;border:none;background:var(--surface-2);font-weight:800;font-size:15px}
.qty-stepper span{min-width:20px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.cart-row .rm{width:30px;height:30px;flex-shrink:0;border:none;background:var(--neg-soft);color:var(--neg);border-radius:9px;font-size:15px}

.grid-toggle{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.grid-toggle button{flex:1;border:none;background:none;padding:9px 6px;border-radius:9px;font-size:13px;font-weight:700;color:var(--ink-soft)}
.grid-toggle button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.divider{height:1px;background:var(--line);margin:14px 0}
.callout{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:12px}
.callout.info{background:var(--accent-soft);color:var(--accent-press)}
.pctbar{height:6px;border-radius:100px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.pctbar .fill{height:100%;background:var(--pos)}
.pctbar .fill.over{background:var(--neg)}

.print-header{display:none}
.print-only{display:none}
@media print{
  @page{ size:A4; margin:9mm 10mm; }
  .header,.nav,.no-print,.pctbar,.callout{display:none!important}
  body{display:block;height:auto;overflow:visible;background:#fff;color:#000;font-size:9.5px;line-height:1.25}
  #app{overflow:visible;height:auto;max-width:none;padding:0}
  .print-header{
    display:block;margin-bottom:6px;padding-bottom:5px;border-bottom:1.5px solid #000;
    break-after:avoid;
  }
  .print-header .brand{font-family:var(--sans);font-weight:700;font-size:10px;letter-spacing:.02em}
  .print-header h2{font-family:var(--display);font-weight:800;font-size:15px;margin:1px 0 1px 0}
  .print-header .meta{font-size:9.5px;color:#333}
  .print-only{display:block}
  .section-title{
    font-family:var(--sans);color:#000;font-size:9.5px;border-bottom:1px solid #000;padding-bottom:2px;
    margin:8px 0 3px 0;break-after:avoid;
  }
  .section-title:first-of-type{margin-top:2px}
  .row.between>.section-title{margin:8px 0 3px 0}
  .card{
    box-shadow:none;border:1px solid #bbb;border-radius:3px;background:#fff;
    padding:2px 8px;margin-bottom:5px;
  }
  table.plan{break-inside:auto;font-size:9.5px}
  table.plan tr{break-inside:avoid}
  table.plan th{color:#444;padding:0 6px 3px 6px}
  table.plan td{color:#000;padding:3px 6px}
  .check-list-columns{column-count:2;column-gap:16px}
  .check-item{
    padding:2.5px 2px;border-bottom:1px solid #ddd;break-inside:avoid;
    display:flex;align-items:center;gap:6px;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }
  .check-item input[type=checkbox]{
    appearance:none;-webkit-appearance:none;width:9px;height:9px;
    border:1px solid #000;border-radius:2px;background:#fff!important;
    accent-color:#000;flex-shrink:0;margin:0;
  }
  .check-item input[type=checkbox]:checked{background:#000!important}
  .item-name{font-family:var(--sans);color:#000;font-size:9.5px;font-weight:700}
  .ticket-print h2{font-size:22px}
  .ticket-item-name{font-size:15px!important}
  .item-sub{font-size:8.5px;color:#444}
  .check-item.done .item-name{color:#666}
  .badge{border:1px solid #666;background:none!important;color:#000!important;padding:1px 6px;font-size:8.5px}
  .strong{font-family:var(--sans);color:#000;font-size:10px}
  .faint[style*="text-transform:uppercase"]{color:#000!important;font-weight:700;font-size:8.5px!important;margin:4px 0 1px 0!important}
  .load-groups{display:flex;gap:10px;align-items:flex-start}
  .load-groups>div{flex:1;min-width:0;margin-bottom:0}
  .btn-row{display:none}
}
</style>
</head>
<body>
<div id="app"></div>

<nav class="nav no-print">
  <div class="nav-inner">
    <button class="nav-btn" data-nav="events" onclick="App.goTab('events')"><span class="ic">📅</span>Eventi</button>
    <button class="nav-btn" data-nav="products" onclick="App.goTab('products')"><span class="ic">🥕</span>Prodotti</button>
    <button class="nav-btn" data-nav="ingredients" onclick="App.goTab('ingredients')"><span class="ic">📦</span>Magazzino</button>
    <button class="nav-btn" data-nav="orders" onclick="App.goTab('orders')"><span class="ic">🧾</span>Comande</button>
    <button class="nav-btn" data-nav="settings" onclick="App.goTab('settings')"><span class="ic">⚙️</span>Impostazioni</button>
  </div>
</nav>

<script>
(function(){
"use strict";

/* ---------------- storage ---------------- */
var KEY = 'ftplanner_v1';
var mem = {};
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return (k in mem)? mem[k] : null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } }

function uid(){ return 'id_' + Date.now().toString(36) + Math.random().toString(36).slice(2,9); }

function defaultDB(){ return { ingredients: [], products: [], events: [], purchases: [], priceArticles: [], orderArticles: [] }; }

function loadDB(){
  var raw = lsGet(KEY);
  if(!raw) return defaultDB();
  try{
    var d = JSON.parse(raw);
    if(!d.ingredients) d.ingredients=[];
    if(!d.products) d.products=[];
    if(!d.events) d.events=[];
    if(!d.purchases) d.purchases=[];
    if(!d.priceArticles) d.priceArticles=[];
    if(!d.orderArticles) d.orderArticles=[];
    return d;
  }catch(e){ return defaultDB(); }
}

var db = loadDB();
function saveDB(){ lsSet(KEY, JSON.stringify(db)); queueAutoSync(); }

/* ---------------- sync config ---------------- */
var CKEY = 'ftplanner_cfg_v1';
function loadCfg(){
  try{ var d = JSON.parse(lsGet(CKEY)); return d && typeof d==='object' ? Object.assign({sheetUrl:'',auto:true,lastSync:null}, d) : {sheetUrl:'',auto:true,lastSync:null}; }
  catch(e){ return {sheetUrl:'',auto:true,lastSync:null}; }
}
var cfg = loadCfg();
function saveCfg(){ lsSet(CKEY, JSON.stringify(cfg)); }

/* ---------------- helpers ---------------- */
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fmtEuro(n){ n = Number(n)||0; return '€ ' + n.toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtNum(n,d){ n = Number(n)||0; return n.toLocaleString('it-IT',{minimumFractionDigits:0,maximumFractionDigits:(d==null?2:d)}); }
function fmtDate(s){
  if(!s) return '—';
  var d = new Date(s+'T00:00:00');
  if(isNaN(d)) return s;
  return d.toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
}
function byId(arr,id){ return arr.find(function(x){ return x.id===id; }); }
function ceilSafe(n){ return n>0 ? Math.ceil(n - 1e-9) : 0; }

function catList(arr){
  var s = {};
  arr.forEach(function(x){ if(x.category) s[x.category]=1; });
  return Object.keys(s).sort();
}

/* ---------------- state ---------------- */
var state = { view:'events', params:{}, draftIngredient:null, draftProduct:null, draftEvent:null, eventSelectMode:false, selectedEventIds:[], selectedUnmatched:[], bulkTargetArticleId:null, draftOrderArticle:null, currentOrder:{items:[], customerName:''} };

function nav(view, params){
  state.view = view;
  state.params = params||{};
  render();
  var appEl = document.getElementById('app');
  if(appEl) appEl.scrollTop = 0;
}

/* ================= CALCULATION ================= */
function recipeRef(r){
  return { refType: r.refType || 'ingredient', refId: r.refId!=null ? r.refId : r.ingredientId, qty: r.qty||0 };
}

// Accumulates one event's ingredient/equipment/preparation needs into shared totals
// (so multiple events can be combined by calling this repeatedly with the same accumulators).
function accumulateEventInto(ev, ingTotals, equipNeeded, prepTotals){
  var menu = (ev.menu||[]).map(function(m){
    var p = byId(db.products, m.productId);
    return p ? { product:p, pctOverride:m.pctOverride } : null;
  }).filter(Boolean);

  var rawSum = 0;
  menu.forEach(function(m){ rawSum += (m.pctOverride!=null ? m.pctOverride : (m.product.pct||0)); });

  var rows = menu.map(function(m){
    var pct = (m.pctOverride!=null ? m.pctOverride : (m.product.pct||0));
    var effPct = rawSum>0 ? (pct/rawSum*100) : 0;
    var revenue = (ev.revenue||0) * effPct/100;
    var price = m.product.price||0;
    var qtyRaw = price>0 ? revenue/price : 0;
    var qtyPlan = ceilSafe(qtyRaw);
    return { product:m.product, pct:pct, effPct:effPct, revenue:revenue, qtyRaw:qtyRaw, qtyPlan:qtyPlan };
  }).sort(function(a,b){ return b.effPct - a.effPct; });

  function expandInto(refType, refId, neededQty, visiting){
    if(!refId || neededQty<=1e-9) return;
    if(refType==='product'){
      if(visiting[refId]) return; // cycle guard: a preparation can't (indirectly) contain itself
      var sub = byId(db.products, refId);
      if(!sub) return;
      prepTotals[refId] = (prepTotals[refId]||0) + neededQty;
      var yieldQty = sub.yieldQty>0 ? sub.yieldQty : 1;
      var batches = neededQty / yieldQty;
      var nextVisiting = Object.assign({}, visiting); nextVisiting[refId] = true;
      (sub.recipe||[]).forEach(function(r){
        var ref = recipeRef(r);
        expandInto(ref.refType, ref.refId, ref.qty*batches, nextVisiting);
      });
      return;
    }
    var ing = byId(db.ingredients, refId);
    if(!ing) return;
    if(ing.type==='equipment'){ equipNeeded[ing.id]=true; }
    else{ ingTotals[ing.id] = (ingTotals[ing.id]||0) + neededQty; }
  }

  rows.forEach(function(r){
    if(r.qtyPlan<=0) return;
    (r.product.recipe||[]).forEach(function(ri){
      var ref = recipeRef(ri);
      expandInto(ref.refType, ref.refId, ref.qty*r.qtyPlan, {});
    });
  });

  return { rows:rows, rawSum:rawSum };
}

// Turns raw accumulated totals into the shopping/preparations/loading structures shown in the UI.
function buildPlanOutputs(ingTotals, equipNeeded, prepTotals){
  db.ingredients.forEach(function(ing){
    if(ing.type==='equipment' && ing.alwaysRequired) equipNeeded[ing.id]=true;
  });

  var shopping = Object.keys(ingTotals).map(function(id){
    var ing = byId(db.ingredients, id);
    var total = ingTotals[id];
    var packages = ing.packageSize ? Math.ceil(total/ing.packageSize - 1e-9) : null;
    return { ing:ing, total:total, packages:packages };
  }).filter(function(x){ return x.total>1e-9; })
    .sort(function(a,b){ return (a.ing.category||'').localeCompare(b.ing.category||'') || a.ing.name.localeCompare(b.ing.name); });

  var preparations = Object.keys(prepTotals).map(function(id){
    var p = byId(db.products, id);
    var total = prepTotals[id];
    var yieldQty = p.yieldQty>0 ? p.yieldQty : 1;
    var batches = Math.ceil(total/yieldQty - 1e-9);
    return { product:p, total:total, yieldQty:yieldQty, batches:batches };
  }).filter(function(x){ return x.product && x.total>1e-9; })
    .sort(function(a,b){ return a.product.name.localeCompare(b.product.name); });

  var loadItems = shopping.map(function(x){
    return { id:'ing_'+x.ing.id, name:x.ing.name, location:x.ing.location, sub: fmtNum(x.total,2)+' '+x.ing.unit + (x.packages? ' · '+x.packages+' conf.':'') };
  });
  Object.keys(equipNeeded).forEach(function(id){
    var ing = byId(db.ingredients, id);
    if(ing) loadItems.push({ id:'eq_'+ing.id, name:ing.name, location:ing.location, sub:'attrezzatura' });
  });
  preparations.forEach(function(x){
    loadItems.push({ id:'prep_'+x.product.id, name:x.product.name, location:x.product.location,
      sub: fmtNum(x.total,2)+' '+(x.product.yieldUnit||'pz')+' · preparazione' });
  });
  var loading = { truck:[], van:[], common:[] };
  loadItems.forEach(function(it){
    var loc = it.location||'both';
    if(loc==='truck') loading.truck.push(it);
    else if(loc==='van') loading.van.push(it);
    else loading.common.push(it);
  });
  ['truck','van','common'].forEach(function(k){
    loading[k].sort(function(a,b){ return a.name.localeCompare(b.name); });
  });

  return { shopping:shopping, preparations:preparations, loading:loading };
}

function computeEventPlan(ev){
  var ingTotals = {}, equipNeeded = {}, prepTotals = {};
  var acc = accumulateEventInto(ev, ingTotals, equipNeeded, prepTotals);
  var built = buildPlanOutputs(ingTotals, equipNeeded, prepTotals);
  var cost = computeCostSummary(acc.rows, ev.revenue||0);
  return { rows:acc.rows, rawSum:acc.rawSum, shopping:built.shopping, preparations:built.preparations, loading:built.loading, cost:cost };
}

// Combines the ingredient/preparation needs of several events into one plan — e.g. two nearby
// events prepped together. Totals are summed BEFORE package/batch rounding, so the result isn't
// just the sum of each event's rounded numbers (which would over-count).
function computeCombinedPlan(events){
  var ingTotals = {}, equipNeeded = {}, prepTotals = {};
  var allRows = [];
  var totalRevenue = 0;
  var perEvent = events.map(function(ev){
    var acc = accumulateEventInto(ev, ingTotals, equipNeeded, prepTotals);
    allRows = allRows.concat(acc.rows);
    totalRevenue += ev.revenue||0;
    return { event:ev, rows:acc.rows, rawSum:acc.rawSum };
  });
  var built = buildPlanOutputs(ingTotals, equipNeeded, prepTotals);
  var cost = computeCostSummary(allRows, totalRevenue);
  return { perEvent:perEvent, shopping:built.shopping, preparations:built.preparations, loading:built.loading, cost:cost };
}

/* ================= FOOD COST ================= */

// Weighted-average price of a canonical price-list article, recomputed live from every
// purchase line linked to it (never a stale stored number).
function getArticleStats(articleId){
  var lines = db.purchases.filter(function(p){ return p.articleId===articleId; });
  if(!lines.length) return null;
  var qtySum = 0, valueSum = 0, suppliers = {}, lastDate = null;
  lines.forEach(function(p){
    var q = p.qty||0, price = p.unitPrice||0;
    qtySum += q; valueSum += q*price;
    if(p.supplier) suppliers[p.supplier]=true;
    if(!lastDate || (p.date||'') > lastDate) lastDate = p.date;
  });
  return {
    avgPrice: qtySum>1e-9 ? valueSum/qtySum : 0,
    totalQty: qtySum, purchaseCount: lines.length,
    supplierCount: Object.keys(suppliers).length, lastDate: lastDate
  };
}

// Cost of 1 unit of an ingredient (in the ingredient's own unit), from its linked price article.
// Returns null if not linked or the article has no purchase history yet.
function getIngredientUnitCost(ing){
  if(!ing || !ing.priceArticleId) return null;
  var stats = getArticleStats(ing.priceArticleId);
  if(!stats) return null;
  var factor = ing.priceFactor>0 ? ing.priceFactor : 1;
  return stats.avgPrice / factor;
}

// Cost to produce 1 unit of a product (sellable or component), expanding sub-recipes recursively.
// `complete` is false if any ingredient along the way has no linked/priced price article — the
// number returned is then a partial/lower-bound cost, so callers must check `complete` before
// treating it as the real food cost.
function computeProductCost(productId, visiting){
  visiting = visiting || {};
  var p = byId(db.products, productId);
  if(!p) return { cost:0, complete:false, missing:['(prodotto eliminato)'] };
  if(visiting[productId]) return { cost:0, complete:true, missing:[] };
  var nextVisiting = Object.assign({}, visiting); nextVisiting[productId]=true;

  var cost = 0, complete = true, missing = [];
  (p.recipe||[]).forEach(function(r){
    var ref = recipeRef(r);
    if(!ref.refId || ref.qty<=0) return;
    if(ref.refType==='product'){
      var sub = byId(db.products, ref.refId);
      if(!sub){ complete=false; missing.push('(componente eliminato)'); return; }
      var subRes = computeProductCost(ref.refId, nextVisiting);
      var yieldQty = sub.yieldQty>0 ? sub.yieldQty : 1;
      cost += (ref.qty/yieldQty) * subRes.cost;
      if(!subRes.complete){ complete=false; missing = missing.concat(subRes.missing); }
    } else {
      var ing = byId(db.ingredients, ref.refId);
      if(!ing){ complete=false; missing.push('(ingrediente eliminato)'); return; }
      var unitCost = getIngredientUnitCost(ing);
      if(unitCost==null){ complete=false; missing.push(ing.name); return; }
      cost += ref.qty * unitCost;
    }
  });
  return { cost:cost, complete:complete, missing:missing };
}

// Rolls per-product cost up to an event (or combined set of events): total ingredient cost,
// estimated margin, and which ingredients (if any) are missing a linked price so the number
// shown is known to be partial rather than silently wrong.
function computeCostSummary(rows, revenue){
  var totalCost = 0, complete = true, missingSet = {};
  rows.forEach(function(r){
    if(r.qtyPlan<=0) return;
    var res = computeProductCost(r.product.id, {});
    totalCost += res.cost * r.qtyPlan;
    if(!res.complete){ complete=false; res.missing.forEach(function(m){ missingSet[m]=true; }); }
  });
  var margin = revenue - totalCost;
  var marginPct = revenue>0 ? (margin/revenue*100) : 0;
  return { totalCost:totalCost, complete:complete, missing:Object.keys(missingSet), revenue:revenue, margin:margin, marginPct:marginPct };
}

// Simple, dependency-free name-similarity score for suggesting price-article matches
// (e.g. typing ingredient "cavolo" suggests the existing article "Cavolo cappuccio").
function nameSimilarity(a, b){
  a = (a||'').toLowerCase().trim(); b = (b||'').toLowerCase().trim();
  if(!a || !b) return 0;
  if(a===b) return 100;
  if(b.indexOf(a)>=0 || a.indexOf(b)>=0) return 80;
  var wa = a.split(/[^a-z0-9àèéìòù]+/i).filter(Boolean);
  var wb = b.split(/[^a-z0-9àèéìòù]+/i).filter(Boolean);
  if(!wa.length || !wb.length) return 0;
  var shared = wa.filter(function(w){ return w.length>2 && wb.indexOf(w)>=0; }).length;
  return shared>0 ? Math.round(shared/Math.max(wa.length,wb.length)*60) : 0;
}

function suggestArticleMatches(name, limit){
  return db.priceArticles.map(function(art){ return { article:art, score:nameSimilarity(name, art.name) }; })
    .filter(function(x){ return x.score>0; })
    .sort(function(a,b){ return b.score-a.score; })
    .slice(0, limit||5);
}

/* ================= GOOGLE SHEETS SYNC ================= */
var syncing = false;
var syncConflict = false;
var autoSyncTimer = null;

function postSheetRaw(payload){
  var url = cfg.sheetUrl;
  return fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})
    .then(function(r){ return r.json(); })
    .catch(function(){
      // CORS/network fallback: fire the request blind (no-cors), we can't read the result
      // so we can't verify success or detect a conflict on this path.
      return fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})
        .then(function(){ return {ok:true, blind:true}; }).catch(function(){ return {ok:false, error:'network'}; });
    });
}

function pushToSheet(silent, force){
  if(!cfg.sheetUrl){ if(!silent) toast('Nessun foglio collegato'); return Promise.resolve(false); }
  syncing = true; if(state.view==='settings') render();
  var ts = new Date().toISOString();
  return postSheetRaw({action:'save', db:db, updatedAt:ts, expectedUpdatedAt: cfg.lastSync||null, force:!!force}).then(function(j){
    syncing = false;
    if(j && j.ok){
      syncConflict = false;
      cfg.lastSync = ts; saveCfg();
      if(!silent) toast('Dati inviati al foglio ✓');
    } else if(j && j.conflict){
      syncConflict = true;
      toast('⚠️ Il foglio è stato aggiornato da un altro dispositivo: invio bloccato per non perdere dati. Vai su Impostazioni.');
    } else if(!silent){
      toast('Invio non riuscito — riprovo più tardi');
    }
    if(state.view==='settings') render();
    return !!(j && j.ok);
  }).catch(function(){
    syncing = false; if(!silent) toast('Errore di rete durante l\'invio');
    if(state.view==='settings') render();
    return false;
  });
}

function pullFromSheet(silent){
  if(!cfg.sheetUrl){ if(!silent) toast('Nessun foglio collegato'); return Promise.resolve(false); }
  syncing = true; if(state.view==='settings') render();
  return fetch(cfg.sheetUrl+'?action=data',{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.json(); })
    .then(function(j){
      syncing = false;
      if(!j || !j.ok){ throw new Error('risposta non valida'); }
      if(j.db){
        db = j.db;
        if(!db.ingredients) db.ingredients=[];
        if(!db.products) db.products=[];
        if(!db.events) db.events=[];
        lsSet(KEY, JSON.stringify(db));
      }
      syncConflict = false;
      cfg.lastSync = j.updatedAt || new Date().toISOString(); saveCfg();
      if(!silent) toast('Dati scaricati dal foglio ✓');
      render();
      return true;
    })
    .catch(function(){
      syncing = false; if(!silent) toast('Impossibile scaricare dal foglio');
      if(state.view==='settings') render();
      return false;
    });
}

function queueAutoSync(){
  if(!cfg.sheetUrl || !cfg.auto || syncConflict) return;
  if(autoSyncTimer) clearTimeout(autoSyncTimer);
  autoSyncTimer = setTimeout(function(){ autoSyncTimer=null; pushToSheet(true); }, 800);
}

document.addEventListener('visibilitychange', function(){
  if(document.hidden || !cfg.sheetUrl || !cfg.auto) return;
  if(syncing || autoSyncTimer || syncConflict) return;
  pullFromSheet(true);
});

function connectSheet(url){
  cfg.sheetUrl = url; saveCfg(); render();
  var localHasData = db.ingredients.length>0 || db.products.length>0 || db.events.length>0;
  fetch(cfg.sheetUrl+'?action=data',{cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(j){
      var remoteHasData = j && j.ok && j.db && (
        (j.db.ingredients&&j.db.ingredients.length) || (j.db.products&&j.db.products.length) || (j.db.events&&j.db.events.length)
      );
      if(remoteHasData && localHasData){
        var useRemote = confirm('Il foglio collegato contiene già dei dati salvati.\n\nOK = scarica i dati dal foglio (sostituisce quelli su questo dispositivo)\nAnnulla = invia i dati di questo dispositivo al foglio (sostituisce quelli sul foglio)');
        if(useRemote){ pullFromSheet(false); } else { cfg.lastSync = j.updatedAt||null; pushToSheet(false, true); }
      } else if(remoteHasData){
        pullFromSheet(false);
      } else {
        pushToSheet(false);
      }
    })
    .catch(function(){ toast('Collegamento salvato, ma non è stato possibile contattare il foglio adesso'); render(); });
}

var APPS_SCRIPT_CODE = `// =====================================================
// VegMan Planner — Apps Script (incolla intero)
// =====================================================
var DATA_SHEET = 'Data';

function doGet(e) {
  var action = e && e.parameter && e.parameter.action;
  if (action === 'data') return jsonResponse(getData());
  if (action === 'meta') return jsonResponse(getMeta());
  return jsonResponse({ok:true, info:'VegMan Planner script attivo'});
}

function doPost(e) {
  var lock = LockService.getScriptLock();
  lock.waitLock(10000);
  try {
    var payload = JSON.parse(e.postData.contents);
    var action = payload.action || 'save';
    if (action === 'ping') return jsonResponse({ok:true});
    if (action === 'save') return jsonResponse(saveData(payload));
    return jsonResponse({ok:false, error:'azione sconosciuta'});
  } catch(err) {
    return jsonResponse({ok:false, error:err.toString()});
  } finally {
    lock.releaseLock();
  }
}

function getData() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sh = ss.getSheetByName(DATA_SHEET);
  if (!sh) return {ok:true, db:null, updatedAt:null};
  var json = sh.getRange('A1').getValue();
  var updatedAt = sh.getRange('B1').getValue();
  if (!json) return {ok:true, db:null, updatedAt:null};
  try {
    return {ok:true, db: JSON.parse(json), updatedAt: updatedAt ? String(updatedAt) : null};
  } catch(e) {
    return {ok:true, db:null, updatedAt:null};
  }
}

function getMeta() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sh = ss.getSheetByName(DATA_SHEET);
  if (!sh) return {ok:true, updatedAt:null};
  var updatedAt = sh.getRange('B1').getValue();
  return {ok:true, updatedAt: updatedAt ? String(updatedAt) : null};
}

// Scrive solo se nessun altro dispositivo ha salvato nel frattempo
// (confronta expectedUpdatedAt con l'updatedAt attualmente sul foglio).
// Cosi' due telefoni che sincronizzano insieme non si sovrascrivono a vicenda.
function saveData(payload) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sh = ss.getSheetByName(DATA_SHEET);
  if (!sh) sh = ss.insertSheet(DATA_SHEET);
  var currentRaw = sh.getRange('B1').getValue();
  var current = currentRaw ? String(currentRaw) : null;
  if (!payload.force && current && payload.expectedUpdatedAt !== current) {
    return {ok:false, conflict:true, updatedAt:current};
  }
  var db = payload.db || {ingredients:[], products:[], events:[]};
  var newUpdatedAt = payload.updatedAt || new Date().toISOString();
  sh.getRange('A1').setValue(JSON.stringify(db));
  sh.getRange('B1').setValue(newUpdatedAt);
  sh.getRange('C1').setValue("Non modificare queste celle a mano: i dati sono gestiti dall'app.");
  try {
    exportTables(ss, db);
  } catch (exportErr) {
    // L'export delle tabelle leggibili non deve mai far fallire il salvataggio vero e proprio.
  }
  return {ok:true, updatedAt:newUpdatedAt};
}

function jsonResponse(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);
}

/* ===================== TABELLE LEGGIBILI (per analisi/pivot) =====================
   Ad ogni salvataggio, oltre al blob dati in "Data", lo script scrive anche queste
   tabelle vere e proprie, pronte per essere lette, filtrate o messe in una tabella
   pivot direttamente su Google Sheets. Vengono rigenerate ad ogni sync: non
   modificarle a mano (le modifiche andrebbero perse) — per analisi personalizzate
   crea un foglio nuovo e referenzia questi dati con QUERY o una tabella pivot. */

function getOrCreateSheet(ss, name) {
  var sh = ss.getSheetByName(name);
  if (!sh) sh = ss.insertSheet(name);
  return sh;
}

function writeTable(sh, headers, rows) {
  sh.clearContents();
  sh.getRange(1, 1, 1, headers.length).setValues([headers]).setFontWeight('bold');
  if (rows.length) sh.getRange(2, 1, rows.length, headers.length).setValues(rows);
  sh.setFrozenRows(1);
}

function byId(list, id) {
  for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
  return null;
}

function locLabel(loc) {
  if (loc === 'truck') return 'Food Truck';
  if (loc === 'van') return 'Furgone';
  return 'Entrambi';
}

function round2(n) { return Math.round((n || 0) * 100) / 100; }

function exportTables(ss, db) {
  var ingredients = (db.ingredients || []).slice().sort(function(a,b){ return (a.name||'').localeCompare(b.name||''); });
  var products = (db.products || []).slice().sort(function(a,b){
    var ak = a.kind==='component' ? 1 : 0, bk = b.kind==='component' ? 1 : 0;
    return ak-bk || (a.name||'').localeCompare(b.name||'');
  });
  var events = (db.events || []).slice().sort(function(a,b){ return (a.date||'').localeCompare(b.date||''); });

  var ingRows = ingredients.map(function(i){
    return [i.id, i.name||'', i.category||'', i.type==='equipment'?'Attrezzatura':'Consumabile',
      i.unit||'', locLabel(i.location), i.packageSize||'', i.alwaysRequired?'Sì':''];
  });
  writeTable(getOrCreateSheet(ss,'Ingredienti'),
    ['ID','Nome','Categoria','Tipo','Unità','Posizione','Formato confezione','Sempre necessaria'], ingRows);

  var purchases = db.purchases || [];
  var priceArticles = (db.priceArticles || []).slice().sort(function(a,b){ return (a.name||'').localeCompare(b.name||''); });

  var prodRows = products.map(function(p){
    var isComp = p.kind==='component';
    var costRes = computeProductCostGAS(p.id, ingredients, products, purchases, {});
    var costTxt = costRes.complete ? round2(costRes.cost) : (round2(costRes.cost)+' (parziale)');
    var fcPct = (!isComp && p.price>0 && costRes.complete) ? round2(costRes.cost/p.price*100) : '';
    return [p.id, p.name||'', p.category||'', isComp?'Semilavorato':'In vendita',
      isComp?'':(p.price||0), isComp?'':(p.pct||0),
      isComp?(p.yieldQty||1):'', isComp?(p.yieldUnit||''):'', isComp?locLabel(p.location):'',
      costTxt, fcPct];
  });
  writeTable(getOrCreateSheet(ss,'Prodotti'),
    ['ID','Nome','Categoria','Tipo','Prezzo','% storica','Resa quantità','Resa unità','Posizione','Food cost','Food cost %'], prodRows);

  var artRows = priceArticles.map(function(a){
    var stats = getArticleStatsGAS(a.id, purchases);
    return [a.id, a.name||'', a.unit||'', stats?round2(stats.avgPrice):'', stats?round2(stats.totalQty):0,
      stats?stats.supplierCount:0, stats?stats.purchaseCount:0, stats?stats.lastDate:''];
  });
  writeTable(getOrCreateSheet(ss,'Prezzi'),
    ['ID','Articolo','Unità','Prezzo medio ponderato','Quantità totale acquistata','N. fornitori','N. acquisti','Ultimo acquisto'], artRows);

  var purchRows = purchases.slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); }).map(function(p){
    var art = p.articleId ? byId(priceArticles, p.articleId) : null;
    return [p.date||'', p.supplier||'', p.invoiceNumber||'', p.description||'', p.qty||0, p.unit||'', p.unitPrice||0,
      round2((p.qty||0)*(p.unitPrice||0)), art?art.name:'(non collegato)'];
  });
  writeTable(getOrCreateSheet(ss,'Acquisti'),
    ['Data','Fornitore','N. fattura','Descrizione','Quantità','Unità','Prezzo unitario','Totale riga','Articolo collegato'], purchRows);

  var recipeRows = [];
  products.forEach(function(p){
    (p.recipe||[]).forEach(function(r){
      var refType = r.refType||'ingredient';
      var refId = r.refId!=null ? r.refId : r.ingredientId;
      var refName = '(eliminato)', refUnit = '';
      if (refType==='product') { var rp=byId(products,refId); if(rp){ refName=rp.name; refUnit=rp.yieldUnit||''; } }
      else { var ri=byId(ingredients,refId); if(ri){ refName=ri.name; refUnit=ri.unit||''; } }
      recipeRows.push([p.name, refType==='product'?'Preparazione':'Ingrediente', refName, r.qty||0, refUnit]);
    });
  });
  writeTable(getOrCreateSheet(ss,'Ricette'),
    ['Prodotto','Tipo riferimento','Riferimento','Quantità','Unità'], recipeRows);

  var evRows = events.map(function(ev){
    var plan = computePlan(ev, products, ingredients);
    var cost = costSummaryGAS(plan.rows, ev.revenue||0, ingredients, products, purchases);
    return [ev.id, ev.name||'', ev.date||'', ev.revenue||0, (ev.menu||[]).length,
      cost.complete?round2(cost.totalCost):(round2(cost.totalCost)+' (parziale)'), round2(cost.margin), round2(cost.marginPct)];
  });
  writeTable(getOrCreateSheet(ss,'Eventi'),
    ['ID','Nome','Data','Fatturato previsto','N. prodotti in menu','Costo ingredienti stimato','Margine stimato','Margine %'], evRows);

  var salesRows = [], shopRows = [], prepRows = [];
  events.forEach(function(ev){
    var plan = computePlan(ev, products, ingredients);
    plan.rows.forEach(function(r){
      salesRows.push([ev.name||'', ev.date||'', r.product.name, round2(r.effPct), round2(r.revenue), r.qtyPlan]);
    });
    plan.shopping.forEach(function(x){
      shopRows.push([ev.name||'', ev.date||'', x.ing.name, x.ing.category||'', round2(x.total), x.ing.unit||'', x.packages!=null?x.packages:'']);
    });
    plan.preparations.forEach(function(x){
      prepRows.push([ev.name||'', ev.date||'', x.product.name, round2(x.total), x.product.yieldUnit||'', x.batches]);
    });
  });
  writeTable(getOrCreateSheet(ss,'Eventi_Vendite'),
    ['Evento','Data','Prodotto','% effettiva','Fatturato stimato','Quantità da preparare'], salesRows);
  writeTable(getOrCreateSheet(ss,'Eventi_Spesa'),
    ['Evento','Data','Ingrediente','Categoria','Quantità','Unità','Confezioni'], shopRows);
  writeTable(getOrCreateSheet(ss,'Eventi_Preparazioni'),
    ['Evento','Data','Semilavorato','Quantità','Unità','N. ricette'], prepRows);
}

/* Motore di calcolo — stessa identica logica usata nell'app (stima vendite,
   espansione ricorsiva delle preparazioni fino agli ingredienti grezzi). */
function computePlan(ev, products, ingredients) {
  var menu = (ev.menu||[]).map(function(m){
    var p = byId(products, m.productId);
    return p ? {product:p, pctOverride:m.pctOverride} : null;
  }).filter(function(x){ return x; });

  var rawSum = 0;
  menu.forEach(function(m){ rawSum += (m.pctOverride!=null ? m.pctOverride : (m.product.pct||0)); });

  var rows = menu.map(function(m){
    var pct = (m.pctOverride!=null ? m.pctOverride : (m.product.pct||0));
    var effPct = rawSum>0 ? (pct/rawSum*100) : 0;
    var revenue = (ev.revenue||0) * effPct/100;
    var price = m.product.price||0;
    var qtyRaw = price>0 ? revenue/price : 0;
    var qtyPlan = qtyRaw>0 ? Math.ceil(qtyRaw - 1e-9) : 0;
    return {product:m.product, pct:pct, effPct:effPct, revenue:revenue, qtyPlan:qtyPlan};
  });

  var ingTotals = {}, equipNeeded = {}, prepTotals = {};

  function recipeRef(r) {
    return {refType:r.refType||'ingredient', refId:(r.refId!=null?r.refId:r.ingredientId), qty:r.qty||0};
  }
  function expandInto(refType, refId, neededQty, visiting) {
    if (!refId || neededQty<=1e-9) return;
    if (refType==='product') {
      if (visiting[refId]) return;
      var sub = byId(products, refId);
      if (!sub) return;
      prepTotals[refId] = (prepTotals[refId]||0) + neededQty;
      var yieldQty = sub.yieldQty>0 ? sub.yieldQty : 1;
      var batches = neededQty/yieldQty;
      var nextVisiting = {}; for (var k in visiting) nextVisiting[k]=visiting[k]; nextVisiting[refId]=true;
      (sub.recipe||[]).forEach(function(r){
        var ref = recipeRef(r);
        expandInto(ref.refType, ref.refId, ref.qty*batches, nextVisiting);
      });
      return;
    }
    var ing = byId(ingredients, refId);
    if (!ing) return;
    if (ing.type==='equipment') equipNeeded[ing.id]=true;
    else ingTotals[ing.id] = (ingTotals[ing.id]||0) + neededQty;
  }

  rows.forEach(function(r){
    if (r.qtyPlan<=0) return;
    (r.product.recipe||[]).forEach(function(ri){
      var ref = recipeRef(ri);
      expandInto(ref.refType, ref.refId, ref.qty*r.qtyPlan, {});
    });
  });

  var shopping = Object.keys(ingTotals).map(function(id){
    var ing = byId(ingredients, id);
    var total = ingTotals[id];
    var packages = ing.packageSize ? Math.ceil(total/ing.packageSize - 1e-9) : null;
    return {ing:ing, total:total, packages:packages};
  }).filter(function(x){ return x.total>1e-9; });

  var preparations = Object.keys(prepTotals).map(function(id){
    var p = byId(products, id);
    var total = prepTotals[id];
    var yieldQty = p ? (p.yieldQty>0?p.yieldQty:1) : 1;
    var batches = Math.ceil(total/yieldQty - 1e-9);
    return {product:p, total:total, yieldQty:yieldQty, batches:batches};
  }).filter(function(x){ return x.product && x.total>1e-9; });

  return {rows:rows, shopping:shopping, preparations:preparations};
}

/* ----- food cost: stessa logica del motore prezzi dell'app ----- */
function getArticleStatsGAS(articleId, purchases) {
  var lines = purchases.filter(function(p){ return p.articleId===articleId; });
  if (!lines.length) return null;
  var qtySum=0, valueSum=0, suppliers={}, lastDate=null;
  lines.forEach(function(p){
    var q=p.qty||0, price=p.unitPrice||0;
    qtySum += q; valueSum += q*price;
    if (p.supplier) suppliers[p.supplier]=true;
    if (!lastDate || (p.date||'')>lastDate) lastDate=p.date;
  });
  return { avgPrice: qtySum>1e-9?valueSum/qtySum:0, totalQty:qtySum, purchaseCount:lines.length,
    supplierCount:Object.keys(suppliers).length, lastDate:lastDate };
}

function getIngredientUnitCostGAS(ing, purchases) {
  if (!ing || !ing.priceArticleId) return null;
  var stats = getArticleStatsGAS(ing.priceArticleId, purchases);
  if (!stats) return null;
  var factor = ing.priceFactor>0 ? ing.priceFactor : 1;
  return stats.avgPrice/factor;
}

function computeProductCostGAS(productId, ingredients, products, purchases, visiting) {
  visiting = visiting || {};
  var p = byId(products, productId);
  if (!p) return {cost:0, complete:false, missing:['(prodotto eliminato)']};
  if (visiting[productId]) return {cost:0, complete:true, missing:[]};
  var nextVisiting = {}; for (var k in visiting) nextVisiting[k]=visiting[k]; nextVisiting[productId]=true;

  var cost=0, complete=true, missing=[];
  (p.recipe||[]).forEach(function(r){
    var refType = r.refType||'ingredient';
    var refId = r.refId!=null ? r.refId : r.ingredientId;
    var qty = r.qty||0;
    if (!refId || qty<=0) return;
    if (refType==='product') {
      var sub = byId(products, refId);
      if (!sub) { complete=false; missing.push('(componente eliminato)'); return; }
      var subRes = computeProductCostGAS(refId, ingredients, products, purchases, nextVisiting);
      var yieldQty = sub.yieldQty>0 ? sub.yieldQty : 1;
      cost += (qty/yieldQty) * subRes.cost;
      if (!subRes.complete) { complete=false; missing = missing.concat(subRes.missing); }
    } else {
      var ing = byId(ingredients, refId);
      if (!ing) { complete=false; missing.push('(ingrediente eliminato)'); return; }
      var unitCost = getIngredientUnitCostGAS(ing, purchases);
      if (unitCost==null) { complete=false; missing.push(ing.name); return; }
      cost += qty*unitCost;
    }
  });
  return {cost:cost, complete:complete, missing:missing};
}

function costSummaryGAS(rows, revenue, ingredients, products, purchases) {
  var totalCost=0, complete=true;
  rows.forEach(function(r){
    if (r.qtyPlan<=0) return;
    var res = computeProductCostGAS(r.product.id, ingredients, products, purchases, {});
    totalCost += res.cost*r.qtyPlan;
    if (!res.complete) complete=false;
  });
  var margin = revenue-totalCost;
  var marginPct = revenue>0 ? (margin/revenue*100) : 0;
  return {totalCost:totalCost, complete:complete, margin:margin, marginPct:marginPct};
}

/* ================= STAMPA BLUETOOTH (COMANDE) ================= */
// Molte mini-stampanti termiche economiche espongono la stampa su un servizio BLE
// generico (non su un profilo standard): l'elenco qui sotto raccoglie gli UUID di
// servizio più diffusi tra i cloni in commercio. Il Web Bluetooth API richiede che un
// servizio sia elencato in anticipo (in optionalServices) per poterlo poi leggere: non
// è possibile "scoprire" un servizio arbitrario su un dispositivo sconosciuto.
var BT_SERVICE_UUIDS = [
  '000018f0-0000-1000-8000-00805f9b34fb',
  '0000ff00-0000-1000-8000-00805f9b34fb',
  '0000ffe0-0000-1000-8000-00805f9b34fb',
  '49535343-fe7d-4ae5-8fa9-9fafd205e455',
  '6e400001-b5a3-f393-e0a9-e50e24dcca9e'
];
var BT_DEVICEID_KEY = 'ftplanner_btprinter_id';
var btDevice = null, btChar = null;

function requestPrinterDevice(){
  return navigator.bluetooth.requestDevice({ acceptAllDevices:true, optionalServices:BT_SERVICE_UUIDS });
}

// Cerca, tra tutti i servizi concessi dall'utente, la prima caratteristica scrivibile:
// non sappiamo a priori quale servizio/caratteristica usi il modello di stampante collegato.
function findWritableChar(server){
  return server.getPrimaryServices().then(function(services){
    var chain = Promise.resolve(null);
    services.forEach(function(svc){
      chain = chain.then(function(found){
        if(found) return found;
        return svc.getCharacteristics().then(function(chars){
          return chars.find(function(c){ return c.properties.write || c.properties.writeWithoutResponse; }) || null;
        }).catch(function(){ return null; });
      });
    });
    return chain;
  }).then(function(found){
    if(!found) throw new Error('Nessuna caratteristica scrivibile trovata su questo dispositivo.');
    return found;
  });
}

function connectPrinter(forceNew){
  if(!navigator.bluetooth){
    return Promise.reject(new Error('Bluetooth non supportato da questo browser. Usa Chrome o Edge su Android o su desktop, con il Bluetooth attivo.'));
  }
  if(!forceNew && btDevice && btDevice.gatt && btDevice.gatt.connected && btChar) return Promise.resolve(btChar);

  function afterDevice(device){
    btDevice = device;
    lsSet(BT_DEVICEID_KEY, device.id);
    device.addEventListener('gattserverdisconnected', function(){ btChar=null; });
    return device.gatt.connect().then(findWritableChar).then(function(ch){ btChar=ch; render(); return ch; });
  }

  // navigator.bluetooth.getDevices() permette di riconnettersi a un dispositivo già
  // autorizzato in passato senza mostrare di nuovo il popup di scelta (se il browser lo
  // supporta); altrimenti si richiede sempre una nuova selezione.
  if(!forceNew && navigator.bluetooth.getDevices){
    var savedId = lsGet(BT_DEVICEID_KEY);
    if(savedId){
      return navigator.bluetooth.getDevices().then(function(devices){
        var d = devices.find(function(x){ return x.id===savedId; });
        return afterDevice(d || null);
      }).catch(function(){ return null; }).then(function(res){
        if(res) return res;
        return requestPrinterDevice().then(afterDevice);
      });
    }
  }
  return requestPrinterDevice().then(afterDevice);
}

function forgetPrinter(){
  if(btDevice && btDevice.gatt && btDevice.gatt.connected){ try{ btDevice.gatt.disconnect(); }catch(e){} }
  btDevice = null; btChar = null;
  try{ localStorage.removeItem(BT_DEVICEID_KEY); }catch(e){}
}

function writeChunk(characteristic, chunk){
  if(characteristic.properties.writeWithoutResponse && !characteristic.properties.write){
    return characteristic.writeValueWithoutResponse(chunk);
  }
  return characteristic.writeValue(chunk);
}

function writeInChunks(characteristic, bytes){
  var CHUNK = 180; // dimensione prudente: molti moduli BLE negoziano un MTU ridotto
  var i = 0;
  function next(){
    if(i>=bytes.length) return Promise.resolve();
    var slice = bytes.slice(i, i+CHUNK);
    i += CHUNK;
    return writeChunk(characteristic, slice).then(next);
  }
  return next();
}

// Molte stampanti ESC/POS economiche non gestiscono in modo affidabile l'UTF-8 e le
// tabelle codici accentate: si rimuovono i diacritici (è→e) per garantire un testo
// sempre leggibile, indipendentemente dalla tabella codici della stampante collegata.
function stripDiacritics(s){
  return String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function textBytes(s){ return Array.prototype.slice.call(new TextEncoder().encode(stripDiacritics(s))); }

function buildOrderTicketBytes(order, articles){
  var ESC=0x1B, GS=0x1D;
  var out = [];
  function push(){ for(var i=0;i<arguments.length;i++) out.push(arguments[i]); }
  function line(s){ out = out.concat(textBytes(s)); push(0x0A); }
  var LINE = '--------------------------------'; // 32 caratteri: larghezza sicura per carta da 58mm

  push(ESC,0x40); // reset stampante
  push(ESC,0x61,1); // centrato
  push(GS,0x21,0x11); // doppia altezza+larghezza
  line('COMANDA');
  push(GS,0x21,0x00); // dimensione normale
  var now = new Date();
  line(now.toLocaleDateString('it-IT')+' '+now.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}));
  push(ESC,0x61,0); // allineato a sinistra
  line(LINE);
  push(ESC,0x45,1,GS,0x21,0x01); // grassetto on + doppia altezza (nome cliente ben leggibile)
  line('Cliente: '+(order.customerName||'—'));
  push(GS,0x21,0x00,ESC,0x45,0); // dimensione normale, grassetto off
  line(LINE);

  push(GS,0x21,0x01); // doppia altezza (articoli ben leggibili in cucina, niente prezzi in comanda)
  order.items.forEach(function(it){
    var a = byId(articles, it.articleId);
    if(!a) return;
    line(it.qty+'x '+a.name);
  });
  push(GS,0x21,0x00);
  line(LINE);
  push(0x0A,0x0A,0x0A,0x0A);
  push(GS,0x56,0x01); // taglio parziale carta (ignorato dalle stampanti senza taglierina)
  return new Uint8Array(out);
}

      }
      var checked = !!ev.shopChecked[x.ing.id];
      h += '<div class="check-item '+(checked?'done':'')+'"><input type="checkbox" '+(checked?'checked':'')+' onchange="App.toggleShopCheck(\''+ev.id+'\',\''+x.ing.id+'\')">'+

    });
    h += '</div>';
  }

  h += '<div class="row between" style="margin-top:18px"><div class="section-title" style="margin:0">Lista carico</div><button class="btn small no-print" onclick="App.copyLoading(\''+ev.id+'\')">📋 Copia</button></div>';

  h += renderLoadGroup('🚚 Food Truck','truck',plan.loading.truck,ev);

  h += renderLoadGroup('📦 Comune / da assegnare','common',plan.loading.common,ev);
  h += '</div>';

  h += '<div class="btn-row no-print"><button class="btn ghost" onclick="window.print()">🖨️ Stampa riepilogo</button></div>';
  return h;
}

function renderCostCard(cost){
  if(!cost || (cost.revenue<=0 && cost.totalCost<=0)) return '';
  var h = '<div class="card"><div class="row between"><span class="muted">Costo ingredienti stimato</span><span class="badge '+(cost.complete?'accent':'warn')+'">'+fmtEuro(cost.totalCost)+(cost.complete?'':' (parziale)')+'</span></div>';
  if(cost.revenue>0){
    h += '<div class="row between" style="margin-top:6px"><span class="muted">Margine stimato</span><span class="badge '+(cost.margin>=0?'pos':'neg')+'">'+fmtEuro(cost.margin)+' · '+fmtNum(cost.marginPct,1)+'%</span></div>';
  }
  if(!cost.complete){
    h += '<div class="faint no-print" style="margin-top:8px">Mancano i prezzi per: '+cost.missing.map(function(m){return esc(m);}).join(', ')+'. Vai su Impostazioni → Food cost per collegarli.</div>';
  }
  h += '</div>';
  return h;
}

/* ================= PRODUCTS ================= */
function viewProductsList(){
  var h = header('Prodotti', { actionIcon:'+', actionPrimary:true, actionFn:'App.newProduct()' });
  var sellable = db.products.filter(function(p){ return (p.kind||'sellable')!=='component'; });
  var components = db.products.filter(function(p){ return p.kind==='component'; });
  var totalPct = sellable.reduce(function(s,p){ return s+(p.pct||0); },0);
  if(sellable.length>0){
    var ok = Math.abs(totalPct-100)<=2;
    h += '<div class="card"><div class="row between"><span class="muted">Totale % storica (prodotti in vendita)</span><span class="badge '+(ok?'pos':'warn')+'">'+fmtNum(totalPct,1)+'%</span></div>'+
      '<div class="pctbar"><div class="fill '+(totalPct>100?'over':'')+'" style="width:'+Math.min(100,totalPct)+'%"></div></div>'+
      (ok?'':'<div class="faint" style="margin-top:6px">Dovrebbe sommare a circa 100% se rappresenta l\'intero storico vendite.</div>')+
      '</div>';
  }
  if(db.products.length===0){
    h += '<div class="empty"><span class="emoji">🥕</span><p>Nessun prodotto a catalogo.<br>Aggiungi i prodotti che vendi con prezzo e % storica di vendita.</p>'+
      '<button class="btn primary" onclick="App.newProduct()">+ Nuovo prodotto</button></div>';
    return h;
  }
  function card(p){
    var nIng = (p.recipe||[]).length;
    var isComp = p.kind==='component';
    var badge = isComp ? '<span class="badge warn">Semilavorato</span>' : '<span class="badge accent">'+fmtNum(p.pct,1)+'%</span>';
    var sub = isComp ? ('Resa: '+fmtNum(p.yieldQty||1,2)+' '+esc(p.yieldUnit||'pz')) : fmtEuro(p.price);
    var costLine = '';
    if(nIng>0){
      var costRes = computeProductCost(p.id, {});
      if(costRes.complete){
        var costTxt = fmtEuro(costRes.cost)+(isComp?('/'+(p.yieldQty||1)+' '+esc(p.yieldUnit||'pz')):'');
        var pctTxt = (!isComp && p.price>0) ? (' · '+fmtNum(costRes.cost/p.price*100,1)+'% food cost') : '';
        costLine = '<div class="faint" style="margin-top:2px">Costo: '+costTxt+pctTxt+'</div>';
      } else {
        costLine = '<div class="faint" style="margin-top:2px;color:var(--warn)">Costo incompleto (prezzi mancanti)</div>';
      }
    }
    return '<div class="card tap" onclick="App.openProduct(\''+p.id+'\')">'+
      '<div class="row between"><span class="strong">'+esc(p.name)+'</span>'+badge+'</div>'+
      '<div class="muted" style="margin-top:4px">'+sub+(p.category?' · '+esc(p.category):'')+'</div>'+
      (nIng>0 ? '<div class="faint" style="margin-top:4px">Ricetta: '+nIng+' ingredienti</div>' : '<div class="faint" style="margin-top:4px;color:var(--warn)">⚠️ nessuna ricetta impostata</div>')+
      costLine+
      '</div>';
  }
  if(sellable.length){
    h += '<div class="section-title">In vendita</div>';
    sellable.slice().sort(byName).forEach(function(p){ h += card(p); });
  }
  if(components.length){
    h += '<div class="section-title">Semilavorati</div>';
    components.slice().sort(function(a,b){return a.name.localeCompare(b.name);}).forEach(function(p){ h += card(p); });
  }
  return h;
}

function byName(a,b){ return (a.name||'').localeCompare(b.name||''); }

function renderIngredientOptions(selectedVal, excludeProductId){
  var cons = db.ingredients.filter(function(i){return i.type!=='equipment';}).sort(byName);
  var eq = db.ingredients.filter(function(i){return i.type==='equipment';}).sort(byName);
  var comps = db.products.filter(function(p){return p.id!==excludeProductId;}).sort(byName);
  var h = '';
  if(cons.length){
    h += '<optgroup label="Consumabili">';
    cons.forEach(function(i){ var v='ingredient:'+i.id; h += '<option value="'+v+'" '+(v===selectedVal?'selected':'')+'>'+esc(i.name)+'</option>'; });
    h += '</optgroup>';
  }
  if(comps.length){
    h += '<optgroup label="Preparazioni">';
    comps.forEach(function(p){ var v='product:'+p.id; h += '<option value="'+v+'" '+(v===selectedVal?'selected':'')+'>'+esc(p.name)+((p.kind||'sellable')==='sellable'?' (prodotto)':'')+'</option>'; });
    h += '</optgroup>';
  }
  if(eq.length){
    h += '<optgroup label="Attrezzatura">';
    eq.forEach(function(i){ var v='ingredient:'+i.id; h += '<option value="'+v+'" '+(v===selectedVal?'selected':'')+'>'+esc(i.name)+'</option>'; });
    h += '</optgroup>';
  }
  return h;
}

      '<div class="field"><label>Quanti "'+esc(d.unit||'?')+'" per 1 "'+esc(linked.unit)+'"</label><input type="number" id="f-pricefactor" min="0.0001" step="0.0001" value="'+(d.priceFactor||1)+'" oninput="App.setIngredientField(\'priceFactor\',parseFloat(this.value)||1)"></div>'+
      '</div>';
    h += '<div class="field hint" style="margin-top:-8px">Es. se l\'ingrediente è in grammi e l\'articolo è prezzato al kg, scrivi 1000.</div>';
    if(stats){
      var unitCost = stats.avgPrice / (d.priceFactor>0?d.priceFactor:1);
      h += '<div class="callout info">Prezzo medio articolo: '+fmtEuro(stats.avgPrice)+'/'+esc(linked.unit)+' → costo stimato '+fmtEuro(unitCost)+'/'+esc(d.unit||'unità')+'</div>';
    } else {
      h += '<div class="callout">Nessun acquisto ancora collegato a questo articolo: il costo sarà 0 finché non carichi una fattura.</div>';
    }
  }
  return h;
}

/* ================= FOOD COST ================= */
function viewFoodCostSection(){
  var h = '<div class="section-title">Food cost — fatture d\'acquisto</div>';
  h += '<div class="card">'+
    '<p class="muted" style="margin-bottom:10px">Carica le fatture elettroniche dei fornitori (.xml oppure .xml.p7m firmate digitalmente): l\'app estrae le righe acquistate e calcola il prezzo medio ponderato di ogni articolo. Collegando poi gli ingredienti del magazzino a questi articoli ottieni il food cost dei prodotti, aggiornato ad ogni nuova fattura.</p>'+
    '<button class="btn small" onclick="document.getElementById(\'invoice-file\').click()">📄 Carica fatture (.xml / .p7m)</button>'+
    '<input type="file" id="invoice-file" accept=".xml,.p7m,application/xml" multiple style="display:none" onchange="App.importInvoices(this.files)">'+
    '</div>';

  var invoiceGroups = {};
  db.purchases.forEach(function(p){
    var key = p.invoiceId || 'legacy';
    if(!invoiceGroups[key]) invoiceGroups[key] = { id:key, supplier:p.supplier, invoiceNumber:p.invoiceNumber, date:p.date, count:0 };
    invoiceGroups[key].count++;
  });
  var invoiceList = Object.keys(invoiceGroups).map(function(k){ return invoiceGroups[k]; })
    .sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
  if(invoiceList.length){
    h += '<div class="card">';
    invoiceList.forEach(function(inv){
      h += '<div class="row between" style="padding:7px 0;border-bottom:1px solid var(--line)">'+
        '<div><div class="strong" style="font-size:13.5px">'+esc(inv.supplier)+(inv.invoiceNumber?' · n. '+esc(inv.invoiceNumber):'')+'</div>'+
        '<div class="faint">'+fmtDate(inv.date)+' · '+inv.count+' righe</div></div>'+
        '<button class="iconbtn" style="width:32px;height:32px" onclick="App.deleteInvoice(\''+inv.id+'\')">🗑️</button>'+
        '</div>';
    });
    h += '</div>';
  }

  var unmatchedMap = {};
  db.purchases.filter(function(p){ return !p.articleId; }).forEach(function(p){
    var key = p.description;
    if(!unmatchedMap[key]) unmatchedMap[key] = { description:key, unit:p.unit, count:0, totalQty:0 };
    unmatchedMap[key].count++;
    unmatchedMap[key].totalQty += p.qty||0;
  });
  var unmatchedList = Object.keys(unmatchedMap).map(function(k){ return unmatchedMap[k]; })
    .sort(function(a,b){ return a.description.localeCompare(b.description); });

  var selectedUnmatched = state.selectedUnmatched || [];

  h += '<div class="section-title">Articoli da collegare'+(unmatchedList.length?' ('+unmatchedList.length+')':'')+'</div>';
  if(unmatchedList.length===0){
    h += '<div class="callout info">Nessun articolo in attesa. Le nuove righe non riconosciute da una fattura futura compariranno qui.</div>';
  } else {
    h += '<div class="callout info">Descrizioni diverse per lo stesso prodotto (es. "olio di girasole" scritto in modo diverso da fornitori diversi)? Seleziona le caselle e collegale tutte insieme allo stesso articolo: il prezzo medio verrà calcolato su tutte le quantità insieme.</div>';
    h += '<div class="card">';
    unmatchedList.forEach(function(u, idx){
      var suggestions = suggestArticleMatches(u.description, 3);
      var selectId = 'match-sel-'+idx;
      var isSel = selectedUnmatched.indexOf(u.description)>=0;
      h += '<div class="unmatched-row" data-desc="'+esc(u.description)+'" data-unit="'+esc(u.unit)+'" style="padding:10px 0;border-bottom:1px solid var(--line)">'+
        '<div class="row" style="gap:10px;align-items:flex-start">'+
        '<input type="checkbox" '+(isSel?'checked':'')+' onchange="App.toggleUnmatchedSelected(this)" style="width:20px;height:20px;margin-top:3px;flex-shrink:0;accent-color:var(--accent)">'+
        '<div class="grow">'+
        '<div class="item-name" style="font-size:13.5px">'+esc(u.description)+'</div>'+
        '<div class="item-sub" style="margin-bottom:8px">'+u.count+' righe · '+fmtNum(u.totalQty,2)+' '+esc(u.unit)+' totali</div>'+
        '<select id="'+selectId+'" style="width:100%;margin-bottom:6px;border:1.5px solid var(--line);border-radius:10px;padding:8px;background:var(--surface)">'+
          '<option value="__new__">+ Nuovo articolo: "'+esc(u.description)+'"</option>'+
          (suggestions.length? ('<optgroup label="Suggeriti">'+suggestions.map(function(s){ return '<option value="'+s.article.id+'">'+esc(s.article.name)+' ('+s.score+'% simile)</option>'; }).join('')+'</optgroup>') : '')+
          (db.priceArticles.length? ('<optgroup label="Tutti gli articoli">'+db.priceArticles.slice().sort(byName).map(function(a){ return '<option value="'+a.id+'">'+esc(a.name)+'</option>'; }).join('')+'</optgroup>') : '')+
        '</select>'+
        '<button class="btn small" onclick="App.linkPurchaseRow(this)">Collega solo questo</button>'+
        '</div></div></div>';
    });
    h += '</div>';

    if(selectedUnmatched.length>0){
      var bulkTarget = state.bulkTargetArticleId || '__new__';
      h += '<div class="card no-print" style="position:sticky;bottom:8px;border:1.5px solid var(--accent)">'+
        '<div class="strong" style="margin-bottom:8px">'+selectedUnmatched.length+' articol'+(selectedUnmatched.length===1?'o':'i')+' selezionat'+(selectedUnmatched.length===1?'o':'i')+'</div>'+
        '<select id="bulk-target" onchange="App.setBulkTarget(this.value)" style="width:100%;margin-bottom:8px;border:1.5px solid var(--line);border-radius:10px;padding:8px;background:var(--surface)">'+
          '<option value="__new__" '+(bulkTarget==='__new__'?'selected':'')+'>+ Nuovo articolo</option>'+
          (db.priceArticles.length? ('<optgroup label="Esistenti">'+db.priceArticles.slice().sort(byName).map(function(a){ return '<option value="'+a.id+'" '+(bulkTarget===a.id?'selected':'')+'>'+esc(a.name)+'</option>'; }).join('')+'</optgroup>') : '')+
        '</select>'+
        (bulkTarget==='__new__' ? '<input type="text" id="bulk-new-name" placeholder="Nome nuovo articolo" value="'+esc(selectedUnmatched[0])+'" style="width:100%;margin-bottom:8px;border:1.5px solid var(--line);border-radius:10px;padding:8px">' : '')+
        '<div class="btn-row" style="margin-top:0"><button class="btn ghost" onclick="App.clearUnmatchedSelection()">Annulla</button><button class="btn primary" onclick="App.linkSelectedUnmatched()">Collega selezionati</button></div>'+
        '</div>';
    }
  }

  h += '<div class="section-title">Database prezzi'+(db.priceArticles.length?' ('+db.priceArticles.length+')':'')+'</div>';
  if(!db.priceArticles.length){
    h += '<div class="callout info">Ancora nessun articolo. Carica delle fatture e collega le righe qui sopra per iniziare a costruire il database prezzi.</div>';
  } else {
    h += '<div class="card">';
    db.priceArticles.slice().sort(byName).forEach(function(a){
      var stats = getArticleStats(a.id);
      h += '<div class="row between" style="padding:8px 0;border-bottom:1px solid var(--line)">'+
        '<div><div class="strong" style="font-size:13.5px">'+esc(a.name)+'</div>'+
        '<div class="faint">'+(stats? (fmtNum(stats.totalQty,2)+' '+esc(a.unit)+' · '+stats.supplierCount+' fornitori · agg. '+fmtDate(stats.lastDate)) : 'nessun acquisto collegato')+'</div></div>'+
        '<div class="row" style="gap:8px;flex-shrink:0">'+
        '<span class="badge accent">'+(stats? (fmtEuro(stats.avgPrice)+'/'+esc(a.unit)) : '—')+'</span>'+
        '<button class="iconbtn" style="width:32px;height:32px" onclick="App.deletePriceArticle(\''+a.id+'\')">🗑️</button>'+
        '</div></div>';
    });
    h += '</div>';
  }
  return h;
}

  /* food cost */
  importInvoices: function(fileList){
    if(!fileList || !fileList.length) return;
    var files = Array.prototype.slice.call(fileList);
    toast('Lettura di '+files.length+' file…');
    Promise.all(files.map(function(file){
      return new Promise(function(resolve){
        var reader = new FileReader();
        reader.onload = function(){
          var text;
          try{ text = new TextDecoder('utf-8', {fatal:false}).decode(reader.result); }
          catch(e){ text = null; }
          resolve({name:file.name, text:text});
        };
        reader.onerror = function(){ resolve({name:file.name, text:null}); };
        reader.readAsArrayBuffer(file);
      });
    })).then(function(results){
      var knownDescToArticle = {};
      db.purchases.forEach(function(p){ if(p.articleId) knownDescToArticle[(p.description||'').trim().toLowerCase()] = p.articleId; });

      var totalLines=0, okFiles=0, errFiles=[];
      results.forEach(function(r){
        if(!r.text){ errFiles.push(r.name+' (lettura fallita)'); return; }
        var xmlText = resolveInvoiceXmlText(r.text, r.name);
        if(!xmlText){ errFiles.push(r.name+': impossibile estrarre l\'XML (file firmato .p7m non riconosciuto)'); return; }
        var res = parseFatturaXML(xmlText, r.name);
        if(!res.ok){ errFiles.push(r.name+': '+res.error); return; }
        var invoiceId = uid();
        res.lines.forEach(function(line){
          var autoArticleId = knownDescToArticle[(line.description||'').trim().toLowerCase()] || null;
          db.purchases.push({
            id: uid(), invoiceId: invoiceId,
            date: line.date, supplier: line.supplier, invoiceNumber: line.invoiceNumber,
            description: line.description, qty: line.qty, unit: line.unit, unitPrice: line.unitPrice,
            articleId: autoArticleId
          });
        });
        totalLines += res.lines.length;
        okFiles++;
      });
      saveDB();
      var fileInput = document.getElementById('invoice-file');
      if(fileInput) fileInput.value='';
      render();
      var msg = okFiles+' fattur'+(okFiles===1?'a':'e')+' importat'+(okFiles===1?'a':'e')+' · '+totalLines+' righe';
      if(errFiles.length) msg += ' · '+errFiles.length+' con errori';
      toast(msg);
      if(errFiles.length) console.warn('Errori import fatture:', errFiles);
    });
  },

      try{
        var d = JSON.parse(reader.result);
        if(!d.ingredients || !d.products || !d.events) throw new Error('formato non valido');

    };
    reader.readAsText(file);

function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast('Copiato negli appunti'); }, function(){ fallbackCopy(text); });
  } else fallbackCopy(text);
}
function fallbackCopy(text){
  var ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand('copy'); toast('Copiato negli appunti'); }catch(e){ alert(text); }
  document.body.removeChild(ta);
}
/* ================= FATTURA ELETTRONICA (SDI) XML PARSER ================= */
// Namespace-agnostic tag lookup: real invoices use different namespace prefixes
// (p:, ns2:, none...) depending on the software that generated them.
function xmlAll(root, localName){
  return Array.prototype.filter.call(root.getElementsByTagName('*'), function(el){
    return el.localName===localName || el.tagName===localName || el.tagName.split(':').pop()===localName;
  });
}
function xmlOne(root, localName){ return xmlAll(root, localName)[0]||null; }
function xmlText(root, localName){ var el=xmlOne(root, localName); return el ? el.textContent.trim() : ''; }
function xmlNum(root, localName){ var t=xmlText(root, localName); var n=parseFloat(t.replace(',','.')); return isNaN(n)?null:n; }

// Fatture firmate digitalmente arrivano come .p7m: una busta binaria CAdES (CMS/PKCS#7) che
// racchiude l'XML. Non serve verificare la firma per leggere i dati — basta ritagliare l'XML
// dalla busta. Decodificando l'intero file come UTF-8 "permissivo", il testo XML incapsulato
// (che è a sua volta UTF-8 valido) rimane intatto e leggibile in mezzo al binario circostante
// (che invece diventa una sequenza di caratteri U+FFFD, innocua per la ricerca dei tag).
// Alcuni firmatari codificano il contenuto della busta CMS come OCTET STRING "costruito" a
// blocchi anziché come blocco unico: ad ogni giunzione tra un blocco e l'altro (di solito ogni
// ~1000 byte) restano alcuni byte dell'intestazione DER del blocco successivo incollati in
// mezzo al testo XML — pochi byte binari isolati, non validi come carattere XML. Vanno tolti,
// altrimenti l'XML risulta malformato pur essendo per il resto perfettamente leggibile.
function stripInvalidXmlChars(s){
  return s.replace(/[\x00-\x08\x0B\x0C\x0E-\x1F�]/g, '');
}

function extractXmlFromP7M(rawText){
  var start = rawText.indexOf('<?xml');
  if(start<0) start = rawText.search(/<([\w.-]+:)?FatturaElettronica[\s>]/);
  if(start<0) return null;
  var head = rawText.slice(start, start+2000);
  var tagMatch = head.match(/<\?xml[^>]*\?>\s*<([\w.-]+:)?([\w.-]+)/) || head.match(/<([\w.-]+:)?([\w.-]+)/);
  if(!tagMatch) return null;
  var closeTag = '</'+(tagMatch[1]||'')+tagMatch[2]+'>';
  var closeIdx = rawText.indexOf(closeTag, start);
  if(closeIdx<0) return null;
  return stripInvalidXmlChars(rawText.slice(start, closeIdx+closeTag.length));
}

// Un file .xml è già testo pulito; un .p7m (o un .xml.p7m) va prima "sbustato". Come fallback
// difensivo, se un file .xml per qualche motivo non sembra XML valido si tenta comunque
// l'estrazione, nel caso l'estensione sia fuorviante.
function resolveInvoiceXmlText(rawText, filename){
  var head = rawText.slice(0,200).replace(/^﻿/, '').replace(/^\s+/, '');
  var looksLikeXml = /^<(\?xml|[\w.-]+:?FatturaElettronica)/.test(head);
  var isP7m = /\.p7m$/i.test(filename||'');
  if(looksLikeXml && !isP7m) return stripInvalidXmlChars(rawText);
  var extracted = extractXmlFromP7M(rawText);
  return extracted || (looksLikeXml ? stripInvalidXmlChars(rawText) : null);
}

// Parses one Fattura Elettronica XML (SDI standard) into raw purchase lines.
// Credit notes (TD04/TD08) are skipped — v1 only imports purchase invoices.
function parseFatturaXML(xmlText_, sourceName){
  var doc;
  try{ doc = new DOMParser().parseFromString(xmlText_, 'application/xml'); }
  catch(e){ return { ok:false, error:'XML non leggibile' }; }
  if(doc.getElementsByTagName('parsererror').length){
    return { ok:false, error:'XML non valido' };
  }
  var bodies = xmlAll(doc, 'FatturaElettronicaBody');
  if(!bodies.length) return { ok:false, error:'Non sembra una Fattura Elettronica (manca FatturaElettronicaBody)' };

  var header = xmlOne(doc, 'FatturaElettronicaHeader');
  var cedente = header ? xmlOne(header, 'CedentePrestatore') : null;
  var supplier = '';
  if(cedente){
    var anagrafica = xmlOne(cedente, 'Anagrafica');
    if(anagrafica){
      var denom = xmlText(anagrafica, 'Denominazione');
      supplier = denom || (xmlText(anagrafica,'Nome')+' '+xmlText(anagrafica,'Cognome')).trim();
    }
  }
  supplier = supplier || 'Fornitore sconosciuto';

  var lines = [];
  var skippedCreditNotes = 0;
  bodies.forEach(function(body){
    var datiGen = xmlOne(body, 'DatiGeneraliDocumento');
    var tipoDoc = datiGen ? xmlText(datiGen, 'TipoDocumento') : '';
    if(tipoDoc==='TD04' || tipoDoc==='TD08'){ skippedCreditNotes++; return; }
    var date = datiGen ? xmlText(datiGen, 'Data') : '';
    var invoiceNum = datiGen ? xmlText(datiGen, 'Numero') : '';
    var beniServizi = xmlOne(body, 'DatiBeniServizi');
    if(!beniServizi) return;
    xmlAll(beniServizi, 'DettaglioLinee').forEach(function(row){
      var desc = xmlText(row, 'Descrizione');
      var qty = xmlNum(row, 'Quantita');
      var unitPrice = xmlNum(row, 'PrezzoUnitario');
      var unit = xmlText(row, 'UnitaMisura');
      if(!desc || qty==null || unitPrice==null || qty<=0) return;
      lines.push({
        date: date, supplier: supplier, invoiceNumber: invoiceNum,
        description: desc, qty: qty, unit: unit||'', unitPrice: unitPrice
      });
    });
  });

  if(!lines.length){
    return { ok:false, error: skippedCreditNotes>0 ? 'Contiene solo note di credito (non importate)' : 'Nessuna riga con quantità e prezzo unitario valorizzati' };
  }
  return { ok:true, supplier:supplier, lines:lines, skippedCreditNotes:skippedCreditNotes };
}

function toast(msg){
  var t=document.createElement('div');
  t.textContent=msg;
  t.style.cssText='position:fixed;left:50%;bottom:calc(var(--navh) + 20px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:100px;font-size:13px;font-weight:700;z-index:100;box-shadow:var(--shadow)';
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 1800);
}

/* safety net: drop any in-progress draft when leaving its form */
var _origNav = nav;
nav = function(view, params){
  if(view!=='ingredientForm') state.draftIngredient=null;
  if(view!=='productForm') state.draftProduct=null;
  if(view!=='eventForm') state.draftEvent=null;
  if(view!=='orderArticleForm') state.draftOrderArticle=null;
  _origNav(view, params);
};

render();
if(cfg.sheetUrl) pullFromSheet(true);
})();
