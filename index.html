<html lang="it">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#241A14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='68' font-size='60' text-anchor='middle'%3E%F0%9F%9A%9A%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#FBF6EE;
  --surface:#FFFFFF;
  --surface-2:#FFF7ED;
  --ink:#241A14;
  --ink-soft:#6B5B4D;
  --ink-faint:#A6978A;
  --line:#EBE0D3;
  --accent:#D9481E;
  --accent-press:#B23A17;
  --accent-soft:#FBE4D8;
  --pos:#3E7C5A;
  --pos-soft:#E4F0E8;
  --neg:#B24A3A;
  --neg-soft:#FBE7E2;
  --warn:#B8862E;
  --warn-soft:#FBF0DD;
  --truck:#2E7D6B;
  --truck-soft:#E3F1EC;
  --van:#35508C;
  --van-soft:#E6EAF5;
  --shadow:0 1px 2px rgba(36,26,20,.06),0 6px 18px rgba(36,26,20,.07);
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --maxw:560px;
  --navh:64px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--navh) + var(--safe-b) + 12px);
}
#app{max-width:var(--maxw);margin:0 auto;padding:0 14px}
h1,h2,h3,p{margin:0}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}
a{color:inherit}

.header{
  position:sticky;top:0;z-index:20;
  background:rgba(251,246,238,.92);backdrop-filter:blur(8px);
  padding:calc(var(--safe-t) + 12px) 0 10px 0;
  display:flex;align-items:center;gap:8px;
  border-bottom:1px solid var(--line);
  margin-bottom:14px;
}
.header-inner{max-width:var(--maxw);margin:0 auto;padding:0 14px;display:flex;align-items:center;gap:8px;width:100%}
.header h1{font-size:19px;font-weight:800;flex:1;letter-spacing:-.01em}
.iconbtn{
  width:38px;height:38px;border-radius:12px;border:none;background:var(--surface-2);
  color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:18px;
  box-shadow:var(--shadow);flex-shrink:0;
}
.iconbtn:active{transform:scale(.95)}
.iconbtn.primary{background:var(--accent);color:#fff}

.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:var(--safe-b);
}
.nav-inner{max-width:var(--maxw);margin:0 auto;display:flex;height:var(--navh)}
.nav-btn{
  flex:1;border:none;background:none;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;color:var(--ink-faint);
  font-size:11px;font-weight:600;
}
.nav-btn .ic{font-size:20px}
.nav-btn.active{color:var(--accent)}

.card{
  background:var(--surface);border-radius:16px;padding:14px 16px;
  box-shadow:var(--shadow);margin-bottom:10px;
}
.card.tap{cursor:pointer}
.card.tap:active{transform:scale(.99)}
.section-title{
  font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;
  color:var(--ink-soft);margin:18px 2px 8px 2px;
}
.section-title:first-child{margin-top:2px}

.empty{
  text-align:center;padding:48px 20px;color:var(--ink-soft);
}
.empty .emoji{font-size:40px;display:block;margin-bottom:10px}
.empty p{margin-bottom:16px;font-size:14px}

.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--ink-soft);font-size:13px}
.faint{color:var(--ink-faint);font-size:12px}
.strong{font-weight:800}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.badge{
  display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;
  padding:3px 8px;border-radius:100px;background:var(--surface-2);color:var(--ink-soft);
  white-space:nowrap;
}
.badge.accent{background:var(--accent-soft);color:var(--accent-press)}
.badge.pos{background:var(--pos-soft);color:var(--pos)}
.badge.neg{background:var(--neg-soft);color:var(--neg)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.truck{background:var(--truck-soft);color:var(--truck)}
.badge.van{background:var(--van-soft);color:var(--van)}

.btn{
  border:none;border-radius:13px;padding:13px 18px;font-weight:800;font-size:15px;
  background:var(--surface-2);color:var(--ink);width:100%;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{background:var(--neg-soft);color:var(--neg)}
.btn.ghost{background:none;box-shadow:none;color:var(--ink-soft)}
.btn.small{width:auto;padding:9px 14px;font-size:13px;border-radius:10px}
.btn-row{display:flex;gap:8px;margin-top:14px}
.btn-row .btn{flex:1}

.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:6px}
.field input[type=text],
.field input[type=number],
.field input[type=date],
.field select,
.field textarea{
  width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;
  padding:12px 13px;color:var(--ink);font-size:15px;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
.field .hint{font-size:12px;color:var(--ink-faint);margin-top:5px}
.field-row{display:flex;gap:10px}
.field-row .field{flex:1}

.check-item{
  display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);
}
.check-item:last-child{border-bottom:none}
.check-item input[type=checkbox]{width:22px;height:22px;flex-shrink:0;accent-color:var(--accent)}
.check-item.done .item-name{text-decoration:line-through;color:var(--ink-faint)}
.item-name{font-weight:700;font-size:14.5px}
.item-sub{font-size:12px;color:var(--ink-soft)}

table.plan{width:100%;border-collapse:collapse;font-size:13.5px}
table.plan th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--ink-faint);padding:0 6px 8px 6px;font-weight:700}
table.plan td{padding:9px 6px;border-top:1px solid var(--line)}
table.plan td.num{text-align:right;font-variant-numeric:tabular-nums}

.menu-pick{border-bottom:1px solid var(--line);padding:12px 2px}
.menu-pick:last-child{border-bottom:none}
.menu-pick .row{gap:10px}
.menu-pick input[type=checkbox]{width:22px;height:22px;flex-shrink:0;accent-color:var(--accent)}
.pct-input{width:64px;text-align:right;border:1.5px solid var(--line);border-radius:8px;padding:6px 7px;font-size:13px}
.pct-live{font-size:12px;color:var(--ink-soft);margin-top:4px;padding-left:34px}

.recipe-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.recipe-row select{flex:2;min-width:0}
.recipe-row input{flex:1;min-width:0}
.recipe-row .unit{width:38px;font-size:12px;color:var(--ink-soft);text-align:center;flex-shrink:0}
.recipe-row .rm{width:34px;height:34px;flex-shrink:0;border:none;background:var(--neg-soft);color:var(--neg);border-radius:9px;font-size:16px}

.grid-toggle{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.grid-toggle button{flex:1;border:none;background:none;padding:9px 6px;border-radius:9px;font-size:13px;font-weight:700;color:var(--ink-soft)}
.grid-toggle button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.divider{height:1px;background:var(--line);margin:14px 0}
.callout{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:12px}
.callout.info{background:var(--accent-soft);color:var(--accent-press)}
.pctbar{height:6px;border-radius:100px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.pctbar .fill{height:100%;background:var(--pos)}
.pctbar .fill.over{background:var(--neg)}

@media print{
  .header,.nav,.no-print{display:none!important}
  body{padding-bottom:0;background:#fff}
  .card{box-shadow:none;border:1px solid #ddd}
}
</style>
</head>
<body>
<div id="app"></div>

<nav class="nav no-print">
  <div class="nav-inner">
    <button class="nav-btn" data-nav="events" onclick="App.goTab('events')"><span class="ic">📅</span>Eventi</button>
    <button class="nav-btn" data-nav="products" onclick="App.goTab('products')"><span class="ic">🍔</span>Prodotti</button>
    <button class="nav-btn" data-nav="ingredients" onclick="App.goTab('ingredients')"><span class="ic">📦</span>Magazzino</button>
    <button class="nav-btn" data-nav="settings" onclick="App.goTab('settings')"><span class="ic">⚙️</span>Impostazioni</button>
  </div>
</nav>

<script>
(function(){
"use strict";

/* ---------------- storage ---------------- */
var KEY = 'ftplanner_v1';
var mem = {};
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return (k in mem)? mem[k] : null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } }

function uid(){ return 'id_' + Date.now().toString(36) + Math.random().toString(36).slice(2,9); }

function defaultDB(){ return { ingredients: [], products: [], events: [] }; }

function loadDB(){
  var raw = lsGet(KEY);
  if(!raw) return defaultDB();
  try{
    var d = JSON.parse(raw);
    if(!d.ingredients) d.ingredients=[];
    if(!d.products) d.products=[];
    if(!d.events) d.events=[];
    return d;
  }catch(e){ return defaultDB(); }
}

var db = loadDB();
function saveDB(){ lsSet(KEY, JSON.stringify(db)); queueAutoSync(); }

/* ---------------- sync config ---------------- */
var CKEY = 'ftplanner_cfg_v1';
function loadCfg(){
  try{ var d = JSON.parse(lsGet(CKEY)); return d && typeof d==='object' ? Object.assign({sheetUrl:'',auto:true,lastSync:null}, d) : {sheetUrl:'',auto:true,lastSync:null}; }
  catch(e){ return {sheetUrl:'',auto:true,lastSync:null}; }
}
var cfg = loadCfg();
function saveCfg(){ lsSet(CKEY, JSON.stringify(cfg)); }

/* ---------------- helpers ---------------- */
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fmtEuro(n){ n = Number(n)||0; return '€ ' + n.toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtNum(n,d){ n = Number(n)||0; return n.toLocaleString('it-IT',{minimumFractionDigits:0,maximumFractionDigits:(d==null?2:d)}); }
function fmtDate(s){
  if(!s) return '—';
  var d = new Date(s+'T00:00:00');
  if(isNaN(d)) return s;
  return d.toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
}
function byId(arr,id){ return arr.find(function(x){ return x.id===id; }); }
function ceilSafe(n){ return n>0 ? Math.ceil(n - 1e-9) : 0; }

function catList(arr){
  var s = {};
  arr.forEach(function(x){ if(x.category) s[x.category]=1; });
  return Object.keys(s).sort();
}

/* ---------------- state ---------------- */
var state = { view:'events', params:{}, draftIngredient:null, draftProduct:null, draftEvent:null };

function nav(view, params){
  state.view = view;
  state.params = params||{};
  render();
  window.scrollTo(0,0);
}

/* ================= CALCULATION ================= */
function computeEventPlan(ev){
  var menu = (ev.menu||[]).map(function(m){
    var p = byId(db.products, m.productId);
    return p ? { product:p, pctOverride:m.pctOverride } : null;
  }).filter(Boolean);

  var rawSum = 0;
  menu.forEach(function(m){ rawSum += (m.pctOverride!=null ? m.pctOverride : (m.product.pct||0)); });

  var rows = menu.map(function(m){
    var pct = (m.pctOverride!=null ? m.pctOverride : (m.product.pct||0));
    var effPct = rawSum>0 ? (pct/rawSum*100) : 0;
    var revenue = (ev.revenue||0) * effPct/100;
    var price = m.product.price||0;
    var qtyRaw = price>0 ? revenue/price : 0;
    var qtyPlan = ceilSafe(qtyRaw);
    return { product:m.product, pct:pct, effPct:effPct, revenue:revenue, qtyRaw:qtyRaw, qtyPlan:qtyPlan };
  }).sort(function(a,b){ return b.effPct - a.effPct; });

  var ingTotals = {};
  var equipNeeded = {};
  rows.forEach(function(r){
    if(r.qtyPlan<=0) return;
    (r.product.recipe||[]).forEach(function(ri){
      var ing = byId(db.ingredients, ri.ingredientId);
      if(!ing) return;
      if(ing.type==='equipment'){ equipNeeded[ing.id]=true; }
      else{
        ingTotals[ing.id] = (ingTotals[ing.id]||0) + (ri.qty||0)*r.qtyPlan;
      }
    });
  });
  db.ingredients.forEach(function(ing){
    if(ing.type==='equipment' && ing.alwaysRequired) equipNeeded[ing.id]=true;
  });

  var shopping = Object.keys(ingTotals).map(function(id){
    var ing = byId(db.ingredients, id);
    var total = ingTotals[id];
    var packages = ing.packageSize ? Math.ceil(total/ing.packageSize - 1e-9) : null;
    return { ing:ing, total:total, packages:packages };
  }).filter(function(x){ return x.total>1e-9; })
    .sort(function(a,b){ return (a.ing.category||'').localeCompare(b.ing.category||'') || a.ing.name.localeCompare(b.ing.name); });

  var loadItems = shopping.map(function(x){ return { ing:x.ing, sub: fmtNum(x.total,2)+' '+x.ing.unit + (x.packages? ' · '+x.packages+' conf.':'') }; });
  Object.keys(equipNeeded).forEach(function(id){
    var ing = byId(db.ingredients, id);
    if(ing) loadItems.push({ ing:ing, sub:'attrezzatura' });
  });
  var loading = { truck:[], van:[], common:[] };
  loadItems.forEach(function(it){
    var loc = it.ing.location||'both';
    if(loc==='truck') loading.truck.push(it);
    else if(loc==='van') loading.van.push(it);
    else loading.common.push(it);
  });
  ['truck','van','common'].forEach(function(k){
    loading[k].sort(function(a,b){ return a.ing.name.localeCompare(b.ing.name); });
  });

  return { rows:rows, rawSum:rawSum, shopping:shopping, loading:loading };
}

/* ================= GOOGLE SHEETS SYNC ================= */
var syncing = false;
var autoSyncTimer = null;

function postSheet(payload){
  var url = cfg.sheetUrl;
  return fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})
    .then(function(r){ return r.json(); }).then(function(j){ return j && j.ok===true; })
    .catch(function(){
      return fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})
        .then(function(){ return true; }).catch(function(){ return false; });
    });
}

function pushToSheet(silent){
  if(!cfg.sheetUrl){ if(!silent) toast('Nessun foglio collegato'); return Promise.resolve(false); }
  syncing = true; if(state.view==='settings') render();
  var ts = new Date().toISOString();
  return postSheet({action:'save', db:db, updatedAt:ts}).then(function(ok){
    syncing = false;
    if(ok){ cfg.lastSync = ts; saveCfg(); if(!silent) toast('Dati inviati al foglio ✓'); }
    else if(!silent) toast('Invio non riuscito — riprovo più tardi');
    if(state.view==='settings') render();
    return ok;
  }).catch(function(){
    syncing = false; if(!silent) toast('Errore di rete durante l\'invio');
    if(state.view==='settings') render();
    return false;
  });
}

function pullFromSheet(silent){
  if(!cfg.sheetUrl){ if(!silent) toast('Nessun foglio collegato'); return Promise.resolve(false); }
  syncing = true; if(state.view==='settings') render();
  return fetch(cfg.sheetUrl+'?action=data',{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.json(); })
    .then(function(j){
      syncing = false;
      if(!j || !j.ok){ throw new Error('risposta non valida'); }
      if(j.db){
        db = j.db;
        if(!db.ingredients) db.ingredients=[];
        if(!db.products) db.products=[];
        if(!db.events) db.events=[];
        lsSet(KEY, JSON.stringify(db));
      }
      cfg.lastSync = j.updatedAt || new Date().toISOString(); saveCfg();
      if(!silent) toast('Dati scaricati dal foglio ✓');
      render();
      return true;
    })
    .catch(function(){
      syncing = false; if(!silent) toast('Impossibile scaricare dal foglio');
      if(state.view==='settings') render();
      return false;
    });
}

function queueAutoSync(){
  if(!cfg.sheetUrl || !cfg.auto) return;
  if(autoSyncTimer) clearTimeout(autoSyncTimer);
  autoSyncTimer = setTimeout(function(){ autoSyncTimer=null; pushToSheet(true); }, 800);
}

function connectSheet(url){
  cfg.sheetUrl = url; saveCfg(); render();
  var localHasData = db.ingredients.length>0 || db.products.length>0 || db.events.length>0;
  fetch(cfg.sheetUrl+'?action=data',{cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(j){
      var remoteHasData = j && j.ok && j.db && (
        (j.db.ingredients&&j.db.ingredients.length) || (j.db.products&&j.db.products.length) || (j.db.events&&j.db.events.length)
      );
      if(remoteHasData && localHasData){
        var useRemote = confirm('Il foglio collegato contiene già dei dati salvati.\n\nOK = scarica i dati dal foglio (sostituisce quelli su questo dispositivo)\nAnnulla = invia i dati di questo dispositivo al foglio (sostituisce quelli sul foglio)');
        if(useRemote) pullFromSheet(false); else pushToSheet(false);
      } else if(remoteHasData){
        pullFromSheet(false);
      } else {
        pushToSheet(false);
      }
    })
    .catch(function(){ toast('Collegamento salvato, ma non è stato possibile contattare il foglio adesso'); render(); });
}

/* ================= APPS SCRIPT TEMPLATE ================= */
var APPS_SCRIPT_CODE =
"// =====================================================\n"+
"// Food Truck Planner — Apps Script (incolla intero)\n"+
"// =====================================================\n"+
"var DATA_SHEET = 'Data';\n"+
"\n"+
"function doGet(e) {\n"+
"  var action = e && e.parameter && e.parameter.action;\n"+
"  if (action === 'data') return jsonResponse(getData());\n"+
"  return jsonResponse({ok:true, info:'Food Truck Planner script attivo'});\n"+
"}\n"+
"\n"+
"function doPost(e) {\n"+
"  try {\n"+
"    var payload = JSON.parse(e.postData.contents);\n"+
"    var action = payload.action || 'save';\n"+
"    if (action === 'ping') return jsonResponse({ok:true});\n"+
"    if (action === 'save') { saveData(payload.db, payload.updatedAt); return jsonResponse({ok:true}); }\n"+
"    return jsonResponse({ok:false, error:'azione sconosciuta'});\n"+
"  } catch(err) {\n"+
"    return jsonResponse({ok:false, error:err.toString()});\n"+
"  }\n"+
"}\n"+
"\n"+
"function getData() {\n"+
"  var ss = SpreadsheetApp.getActiveSpreadsheet();\n"+
"  var sh = ss.getSheetByName(DATA_SHEET);\n"+
"  if (!sh) return {ok:true, db:null, updatedAt:null};\n"+
"  var json = sh.getRange('A1').getValue();\n"+
"  var updatedAt = sh.getRange('B1').getValue();\n"+
"  if (!json) return {ok:true, db:null, updatedAt:null};\n"+
"  try {\n"+
"    return {ok:true, db: JSON.parse(json), updatedAt: updatedAt ? String(updatedAt) : null};\n"+
"  } catch(e) {\n"+
"    return {ok:true, db:null, updatedAt:null};\n"+
"  }\n"+
"}\n"+
"\n"+
"function saveData(dbObj, updatedAt) {\n"+
"  var ss = SpreadsheetApp.getActiveSpreadsheet();\n"+
"  var sh = ss.getSheetByName(DATA_SHEET);\n"+
"  if (!sh) sh = ss.insertSheet(DATA_SHEET);\n"+
"  sh.getRange('A1').setValue(JSON.stringify(dbObj));\n"+
"  sh.getRange('B1').setValue(updatedAt || new Date().toISOString());\n"+
"  sh.getRange('C1').setValue('Non modificare queste celle a mano: i dati sono gestiti dall\\'app.');\n"+
"}\n"+
"\n"+
"function jsonResponse(obj) {\n"+
"  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);\n"+

/* ================= RENDER SHELL ================= */
function header(title, opts){
  opts = opts||{};
  var back = opts.back ? '<button class="iconbtn" onclick="'+opts.back+'">‹</button>' : '';
  var action = opts.actionIcon ? '<button class="iconbtn '+(opts.actionPrimary?'primary':'')+'" onclick="'+opts.actionFn+'">'+opts.actionIcon+'</button>' : '<div style="width:38px"></div>';
  return '<div class="header no-print"><div class="header-inner">'+
    (back || '<div style="width:38px"></div>') +
    '<h1>'+esc(title)+'</h1>' + action +
    '</div></div>';
}

function render(){
  var html = '';
  switch(state.view){
    case 'events': html = viewEventsList(); break;
    case 'eventForm': html = viewEventForm(); break;
    case 'eventDetail': html = viewEventDetail(); break;
    case 'products': html = viewProductsList(); break;
    case 'productForm': html = viewProductForm(); break;
    case 'ingredients': html = viewIngredientsList(); break;
    case 'ingredientForm': html = viewIngredientForm(); break;
    case 'settings': html = viewSettings(); break;
    default: html = viewEventsList();
  }
  document.getElementById('app').innerHTML = html;
  document.querySelectorAll('.nav-btn').forEach(function(b){
    var tab = b.getAttribute('data-nav');
    var active = (tab==='events' && ['events','eventForm','eventDetail'].includes(state.view)) ||
                 (tab==='products' && ['products','productForm'].includes(state.view)) ||
                 (tab==='ingredients' && ['ingredients','ingredientForm'].includes(state.view)) ||
                 (tab==='settings' && state.view==='settings');
    b.classList.toggle('active', !!active);
  });
}

/* ================= EVENTS ================= */
function viewEventsList(){
  var events = db.events.slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
  var h = header('Eventi', { actionIcon:'+', actionPrimary:true, actionFn:'App.newEvent()' });
  if(events.length===0){
    h += '<div class="empty"><span class="emoji">🚚</span>'+
      '<p>Nessun evento pianificato.<br>Crea il primo evento per stimare vendite, spesa e carico.</p>'+
      '<button class="btn primary" onclick="App.newEvent()">+ Nuovo evento</button></div>';
    return h;
  }
  h += '<div class="section-title">In programma</div>';
  events.forEach(function(ev){
    var plan = computeEventPlan(ev);
    h += '<div class="card tap" onclick="App.openEvent(\''+ev.id+'\')">'+
      '<div class="row between"><span class="strong">'+esc(ev.name||'Evento senza nome')+'</span><span class="badge accent">'+fmtEuro(ev.revenue)+'</span></div>'+
      '<div class="muted" style="margin-top:4px">'+fmtDate(ev.date)+' · '+(ev.menu||[]).length+' prodotti nel menu · '+plan.shopping.length+' ingredienti</div>'+
      '</div>';
  });
  return h;
}

function viewEventForm(){
  var isEdit = !!state.params.id;
  var d = state.draftEvent;

  var h = header(isEdit? 'Modifica evento':'Nuovo evento', { back:'App.cancelEventForm()' });
  h += '<div class="field"><label>Nome evento</label><input type="text" id="f-name" value="'+esc(d.name)+'" placeholder="Es. Sagra di San Giovanni" oninput="App.setEventField(\'name\',this.value)"></div>';
  h += '<div class="field-row">'+
       '<div class="field"><label>Data</label><input type="date" id="f-date" value="'+esc(d.date)+'" onchange="App.setEventField(\'date\',this.value)"></div>'+
       '<div class="field"><label>Fatturato previsto</label><input type="number" id="f-revenue" min="0" step="10" value="'+(d.revenue||'')+'" oninput="App.setEventField(\'revenue\',parseFloat(this.value)||0)"></div>'+
       '</div>';

  h += '<div class="section-title">Menu dell\'evento</div>';
  if(db.products.length===0){
    h += '<div class="callout">Non hai ancora prodotti a catalogo. Vai su "Prodotti" e crealo prima, con relativa % storica e ricetta.</div>';
  } else {
    h += '<div class="card">';
    var draftIds = d.menu.map(function(m){return m.productId;});
    var rawSelSum = 0;
    db.products.forEach(function(p){
      var picked = draftIds.indexOf(p.id)>=0;
      var mrow = picked ? d.menu.find(function(m){return m.productId===p.id;}) : null;
      if(picked) rawSelSum += (mrow.pctOverride!=null ? mrow.pctOverride : (p.pct||0));
    });
    db.products.slice().sort(function(a,b){return (b.pct||0)-(a.pct||0);}).forEach(function(p){
      var picked = draftIds.indexOf(p.id)>=0;
      var mrow = picked ? d.menu.find(function(m){return m.productId===p.id;}) : null;
      var pctVal = mrow && mrow.pctOverride!=null ? mrow.pctOverride : (p.pct||0);
      var eff = (picked && rawSelSum>0) ? (pctVal/rawSelSum*100) : 0;
      h += '<div class="menu-pick">'+
        '<div class="row"><input type="checkbox" '+(picked?'checked':'')+' onchange="App.toggleMenuItem(\''+p.id+'\')">'+
        '<div class="grow"><div class="item-name">'+esc(p.name)+'</div><div class="item-sub">'+fmtEuro(p.price)+' · storico '+fmtNum(p.pct,1)+'%</div></div>'+
        (picked? '<input type="number" class="pct-input" min="0" max="100" step="0.5" value="'+fmtNum(pctVal,1)+'" onchange="App.setMenuPct(\''+p.id+'\',this.value)">' : '')+
        '</div>'+
        (picked? '<div class="pct-live">→ '+fmtNum(eff,1)+'% del fatturato evento ≈ '+fmtEuro((d.revenue||0) * eff/100)+'</div>' : '')+
        '</div>';
    });
    h += '</div>';
  }

  h += '<div class="btn-row">';
  if(isEdit) h += '<button class="btn danger" onclick="App.deleteEvent(\''+d.id+'\')">Elimina</button>';
  h += '<button class="btn primary" onclick="App.saveEvent(\''+d.id+'\')">Salva evento</button>';
  h += '</div>';
  return h;
}

function viewEventDetail(){
  var ev = byId(db.events, state.params.id);
  if(!ev) return viewEventsList();
  var plan = computeEventPlan(ev);
  ev.shopChecked = ev.shopChecked||{};
  ev.loadChecked = ev.loadChecked||{};

  var h = header(ev.name||'Evento', { back:'App.goTab(\'events\')', actionIcon:'✎', actionFn:'App.editEvent(\''+ev.id+'\')' });

  h += '<div class="card"><div class="row between"><span class="muted">'+fmtDate(ev.date)+'</span><span class="badge accent">'+fmtEuro(ev.revenue)+' previsti</span></div></div>';

  if(plan.rows.length===0){
    h += '<div class="callout">Nessun prodotto nel menu di questo evento. <a onclick="App.editEvent(\''+ev.id+'\')" style="color:inherit;text-decoration:underline;cursor:pointer">Modifica evento</a> per aggiungerne.</div>';
    return h;
  }

  h += '<div class="section-title">Stima vendite</div><div class="card"><table class="plan"><thead><tr><th>Prodotto</th><th class="num">%</th><th class="num">Fatt.</th><th class="num">Da preparare</th></tr></thead><tbody>';
  plan.rows.forEach(function(r){
    h += '<tr><td>'+esc(r.product.name)+'</td><td class="num">'+fmtNum(r.effPct,1)+'%</td><td class="num">'+fmtEuro(r.revenue)+'</td><td class="num strong">'+r.qtyPlan+' pz</td></tr>';
  });
  h += '</tbody></table></div>';

  h += '<div class="row between" style="margin-top:18px"><div class="section-title" style="margin:0">Lista spesa</div><button class="btn small no-print" onclick="App.copyShopping(\''+ev.id+'\')">📋 Copia</button></div>';
  if(plan.shopping.length===0){
    h += '<div class="callout info">Nessun ingrediente calcolato: aggiungi le ricette ai prodotti in menu.</div>';
  } else {
    var lastCat = null;
    h += '<div class="card">';
    plan.shopping.forEach(function(x,i){
      if(x.ing.category !== lastCat){
        if(i>0) {}
        h += '<div class="faint" style="margin:'+(i>0?'12':'0')+'px 0 4px 0;text-transform:uppercase;font-weight:700">'+esc(x.ing.category||'Altro')+'</div>';
        lastCat = x.ing.category;
      }
      var checked = !!ev.shopChecked[x.ing.id];
      h += '<div class="check-item '+(checked?'done':'')+'"><input type="checkbox" '+(checked?'checked':'')+' onchange="App.toggleShopCheck(\''+ev.id+'\',\''+x.ing.id+'\')">'+
        '<div class="grow"><div class="item-name">'+esc(x.ing.name)+'</div><div class="item-sub">'+fmtNum(x.total,2)+' '+esc(x.ing.unit)+(x.packages!=null? ' · <b>'+x.packages+'</b> confezioni':'')+'</div></div></div>';
    });
    h += '</div>';
  }

  h += '<div class="row between" style="margin-top:18px"><div class="section-title" style="margin:0">Lista carico</div><button class="btn small no-print" onclick="App.copyLoading(\''+ev.id+'\')">📋 Copia</button></div>';
  h += renderLoadGroup('🚚 Food Truck','truck',plan.loading.truck,ev);
  h += renderLoadGroup('🚐 Furgone','van',plan.loading.van,ev);
  h += renderLoadGroup('📦 Comune / da assegnare','common',plan.loading.common,ev);

  h += '<div class="btn-row no-print"><button class="btn ghost" onclick="window.print()">🖨️ Stampa riepilogo</button></div>';
  return h;
}

function renderLoadGroup(title, key, items, ev){
  if(items.length===0) return '';
  var h = '<div class="card"><div class="strong" style="margin-bottom:6px">'+title+'</div>';
  items.forEach(function(it){
    var ckey = 'load_'+key+'_'+it.ing.id;
    var checked = !!ev.loadChecked[ckey];
    h += '<div class="check-item '+(checked?'done':'')+'"><input type="checkbox" '+(checked?'checked':'')+' onchange="App.toggleLoadCheck(\''+ev.id+'\',\''+ckey+'\')">'+
      '<div class="grow"><div class="item-name">'+esc(it.ing.name)+'</div><div class="item-sub">'+esc(it.sub)+'</div></div></div>';
  });
  h += '</div>';
  return h;
}

/* ================= PRODUCTS ================= */
function viewProductsList(){
  var h = header('Prodotti', { actionIcon:'+', actionPrimary:true, actionFn:'App.newProduct()' });
  var totalPct = db.products.reduce(function(s,p){ return s+(p.pct||0); },0);
  if(db.products.length>0){
    var ok = Math.abs(totalPct-100)<=2;
    h += '<div class="card"><div class="row between"><span class="muted">Totale % storica catalogo</span><span class="badge '+(ok?'pos':'warn')+'">'+fmtNum(totalPct,1)+'%</span></div>'+
      '<div class="pctbar"><div class="fill '+(totalPct>100?'over':'')+'" style="width:'+Math.min(100,totalPct)+'%"></div></div>'+
      (ok?'':'<div class="faint" style="margin-top:6px">Dovrebbe sommare a circa 100% se rappresenta l\'intero storico vendite.</div>')+
      '</div>';
  }
  if(db.products.length===0){
    h += '<div class="empty"><span class="emoji">🍔</span><p>Nessun prodotto a catalogo.<br>Aggiungi i prodotti che vendi con prezzo e % storica di vendita.</p>'+
      '<button class="btn primary" onclick="App.newProduct()">+ Nuovo prodotto</button></div>';
    return h;
  }
  h += '<div class="section-title">Catalogo</div>';
  db.products.slice().sort(function(a,b){return (b.pct||0)-(a.pct||0);}).forEach(function(p){
    var nIng = (p.recipe||[]).length;
    h += '<div class="card tap" onclick="App.openProduct(\''+p.id+'\')">'+
      '<div class="row between"><span class="strong">'+esc(p.name)+'</span><span class="badge accent">'+fmtNum(p.pct,1)+'%</span></div>'+
      '<div class="muted" style="margin-top:4px">'+fmtEuro(p.price)+(p.category?' · '+esc(p.category):'')+'</div>'+
      (nIng>0 ? '<div class="faint" style="margin-top:4px">Ricetta: '+nIng+' ingredienti</div>' : '<div class="faint" style="margin-top:4px;color:var(--warn)">⚠️ nessuna ricetta impostata</div>')+
      '</div>';
  });
  return h;
}

function viewProductForm(){
  var isEdit = !!state.params.id;
  var d = state.draftProduct;

  var h = header(isEdit?'Modifica prodotto':'Nuovo prodotto', { back:'App.cancelProductForm()' });

  h += '<div class="field-row">'+
       '<div class="field"><label>Prezzo di vendita</label><input type="number" id="f-price" min="0" step="0.10" value="'+(d.price||'')+'" oninput="App.setProductField(\'price\',parseFloat(this.value)||0)"></div>'+
       '<div class="field"><label>% storica sul fatturato</label><input type="number" id="f-pct" min="0" max="100" step="0.1" value="'+(d.pct||'')+'" oninput="App.setProductField(\'pct\',parseFloat(this.value)||0)"></div>'+
       '</div>';
  h += '<div class="field hint" style="margin-top:-8px">La % storica indica quanto pesa questo prodotto sul fatturato totale, in base ai dati passati.</div>';

  h += '<div class="section-title">Ricetta (per 1 unità venduta)</div>';
  if(db.ingredients.length===0){
    h += '<div class="callout">Nessun ingrediente a magazzino. Vai su "Magazzino" e aggiungine prima di creare la ricetta.</div>';
  } else {
    h += '<div class="card">';
    d.recipe.forEach(function(r,i){
      var ing = byId(db.ingredients, r.ingredientId);
      h += '<div class="recipe-row">'+
        '<select onchange="App.setRecipeIngredient('+i+',this.value)">'+
          '<option value="">Seleziona…</option>'+
          renderIngredientOptions(r.ingredientId)+
        '</select>'+
        '<input type="number" min="0" step="0.01" placeholder="Qtà" value="'+(r.qty||'')+'" oninput="App.setRecipeQty('+i+',this.value)">'+
        '<span class="unit">'+(ing?esc(ing.unit):'')+'</span>'+
        '<button class="rm" onclick="App.removeRecipeRow('+i+')">✕</button>'+
        '</div>';
    });
    h += '<button class="btn small" onclick="App.addRecipeRow()">+ Aggiungi ingrediente</button>';
    h += '</div>';
  }

  h += '<div class="btn-row">';
  if(isEdit) h += '<button class="btn danger" onclick="App.deleteProduct(\''+d.id+'\')">Elimina</button>';
  h += '<button class="btn primary" onclick="App.saveProduct(\''+d.id+'\')">Salva prodotto</button>';
  h += '</div>';
  return h;
}

function renderIngredientOptions(selectedId){
  var cons = db.ingredients.filter(function(i){return i.type!=='equipment';});
  var eq = db.ingredients.filter(function(i){return i.type==='equipment';});
  var h = '';
  if(cons.length){
    h += '<optgroup label="Consumabili">';
    cons.forEach(function(i){ h += '<option value="'+i.id+'" '+(i.id===selectedId?'selected':'')+'>'+esc(i.name)+'</option>'; });
    h += '</optgroup>';
  }
  if(eq.length){
    h += '<optgroup label="Attrezzatura">';
    eq.forEach(function(i){ h += '<option value="'+i.id+'" '+(i.id===selectedId?'selected':'')+'>'+esc(i.name)+'</option>'; });
    h += '</optgroup>';
  }
  return h;
}

/* ================= INGREDIENTS ================= */
function viewIngredientsList(){
  var h = header('Magazzino', { actionIcon:'+', actionPrimary:true, actionFn:'App.newIngredient()' });
  if(db.ingredients.length===0){
    h += '<div class="empty"><span class="emoji">📦</span><p>Nessun ingrediente o attrezzatura.<br>Aggiungi qui tutto quello che usi: ingredienti consumabili e attrezzature fisse.</p>'+
      '<button class="btn primary" onclick="App.newIngredient()">+ Nuovo elemento</button></div>';
    return h;
  }
  var groups = {};
  db.ingredients.forEach(function(i){ var c=i.category||'Altro'; (groups[c]=groups[c]||[]).push(i); });
  Object.keys(groups).sort().forEach(function(c){
    h += '<div class="section-title">'+esc(c)+'</div>';
    groups[c].slice().sort(function(a,b){return a.name.localeCompare(b.name);}).forEach(function(i){
      var locBadge = i.location==='truck' ? '<span class="badge truck">🚚 Truck</span>' : i.location==='van' ? '<span class="badge van">🚐 Furgone</span>' : '<span class="badge">↔️ Entrambi</span>';
      h += '<div class="card tap" onclick="App.openIngredient(\''+i.id+'\')">'+
        '<div class="row between"><span class="strong">'+esc(i.name)+'</span>'+(i.type==='equipment'?'<span class="badge warn">Attrezzatura</span>':'<span class="badge">'+esc(i.unit)+'</span>')+'</div>'+
        '<div class="row" style="margin-top:6px;gap:6px">'+locBadge+(i.type==='equipment'&&i.alwaysRequired?'<span class="badge accent">sempre necessaria</span>':'')+(i.packageSize?'<span class="badge">conf. da '+i.packageSize+' '+esc(i.unit)+'</span>':'')+'</div>'+

    });

  return h;

function renderIngredientTypeFields(d){
  if(d.type==='equipment'){

  }
  return '<div class="field-row">'+
    '<div class="field"><label>Unità di misura</label><input type="text" id="f-unit" value="'+esc(d.unit||'g')+'" placeholder="g, kg, ml, l, pz" oninput="App.setIngredientField(\'unit\',this.value)"></div>'+
    '<div class="field"><label>Formato confezione (opz.)</label><input type="number" id="f-package" min="0" step="0.01" value="'+(d.packageSize||'')+'" placeholder="es. 1000" oninput="App.setIngredientField(\'packageSize\',parseFloat(this.value)||null)"></div>'+
    '</div>';
}

    '<li>Copia l\'<b>URL dell\'app web</b> (finisce con <code>/exec</code>) e incollalo sopra, poi tocca "Salva collegamento".</li>'+
    '</ol>'+
    '<button class="btn small" style="margin-top:12px" onclick="App.copyAppsScript()">📋 Copia script Apps Script</button>'+
    '</div>';

  h += '<div class="callout">I dati vengono salvati come un unico blocco: se modifichi da due dispositivi nello stesso momento, l\'ultimo che sincronizza sovrascrive l\'altro. Evita di lavorare in contemporanea da più telefoni sullo stesso evento.</div>';

  h += '<div class="section-title">Backup dati</div>';
  h += '<div class="card"><p class="muted" style="margin-bottom:12px">Tutti i dati sono salvati solo su questo dispositivo/browser. Esporta un backup per trasferirlo su un altro telefono o conservarlo.</p>'+
    '<div class="btn-row" style="margin-top:0"><button class="btn" onclick="App.exportData()">⬇️ Esporta backup</button>'+
    '<button class="btn" onclick="document.getElementById(\'import-file\').click()">⬆️ Importa backup</button></div>'+
    '<input type="file" id="import-file" accept="application/json" style="display:none" onchange="App.importData(this.files[0])">'+
    '</div>';
  h += '<div class="section-title">Dati</div>';
  h += '<div class="card"><div class="muted">'+db.products.length+' prodotti · '+db.ingredients.length+' elementi in magazzino · '+db.events.length+' eventi</div>'+
    '<div class="btn-row"><button class="btn danger" onclick="App.resetAll()">🗑️ Cancella tutti i dati</button></div></div>';
  h += '<div class="section-title">Come funziona il calcolo</div>';
  h += '<div class="card muted" style="font-size:13px;line-height:1.6">'+
    '1. Per ogni evento inserisci il fatturato previsto e scegli il menu.<br>'+
    '2. Ogni prodotto nel menu ha una % storica (riproporzionata al 100% tra i prodotti scelti) → da qui si stima il fatturato e la quantità da preparare (prezzo di vendita).<br>'+
    '3. Ogni prodotto ha una ricetta pesata (ingredienti per 1 unità) → moltiplicata per la quantità stimata dà la lista della spesa.<br>'+
    '4. Ogni ingrediente/attrezzatura ha una posizione (Food Truck / Furgone) → da qui la lista di carico divisa per mezzo.'+
    '</div>';
  return h;
}

/* ================= APP ACTIONS ================= */
window.App = {
  goTab: function(t){ nav(t); },

  /* events */
  newEvent: function(){
    state.draftEvent = { id:uid(), name:'', date:new Date().toISOString().slice(0,10), revenue:0, menu:[] };
    nav('eventForm', {});
  },
  openEvent: function(id){ nav('eventDetail', {id:id}); },
  editEvent: function(id){
    var ev = byId(db.events, id);
    state.draftEvent = Object.assign({}, ev, { menu:(ev.menu||[]).map(function(m){ return Object.assign({},m); }) });
    nav('eventForm', {id:id});
  },
  cancelEventForm: function(){ var pid=state.params.id; state.draftEvent=null; nav(pid?'eventDetail':'events', pid?{id:pid}:{}); },
  setEventField: function(field, val){ state.draftEvent[field]=val; },
  toggleMenuItem: function(pid){
    var m = state.draftEvent.menu;
    var idx = m.findIndex(function(x){return x.productId===pid;});
    if(idx>=0) m.splice(idx,1);
    else m.push({productId:pid, pctOverride:null});
    render();
  },
  setMenuPct: function(pid, val){
    var m = state.draftEvent.menu.find(function(m){return m.productId===pid;});
    if(m) m.pctOverride = val===''? null : parseFloat(val);
    render();
  },
  saveEvent: function(id){
    var d = state.draftEvent;
    if(!d.name || !d.name.trim()){ alert('Inserisci un nome per l\'evento.'); return; }
    var ev = byId(db.events, id);
    if(!ev){ ev = {id:id, shopChecked:{}, loadChecked:{}}; db.events.push(ev); }
    ev.name=d.name.trim(); ev.date=d.date; ev.revenue=d.revenue||0; ev.menu=d.menu.slice();
    saveDB(); state.draftEvent=null;
    nav('eventDetail', {id:id});
  },
  deleteEvent: function(id){
    if(!confirm('Eliminare definitivamente questo evento?')) return;
    db.events = db.events.filter(function(e){return e.id!==id;});
    saveDB(); state.draftEvent=null; nav('events');
  },
  toggleShopCheck: function(evId, ingId){
    var ev = byId(db.events, evId); if(!ev) return;
    ev.shopChecked = ev.shopChecked||{};
    ev.shopChecked[ingId] = !ev.shopChecked[ingId];
    saveDB(); render();
  },
  toggleLoadCheck: function(evId, key){
    var ev = byId(db.events, evId); if(!ev) return;
    ev.loadChecked = ev.loadChecked||{};
    ev.loadChecked[key] = !ev.loadChecked[key];
    saveDB(); render();
  },
  copyShopping: function(evId){
    var ev = byId(db.events, evId); var plan = computeEventPlan(ev);
    var lines = ['Lista spesa — '+(ev.name||'')+' ('+fmtDate(ev.date)+')',''];
    var lastCat=null;
    plan.shopping.forEach(function(x){
      if(x.ing.category!==lastCat){ lines.push('— '+(x.ing.category||'Altro')+' —'); lastCat=x.ing.category; }
      lines.push('☐ '+x.ing.name+': '+fmtNum(x.total,2)+' '+x.ing.unit+(x.packages!=null?' ('+x.packages+' confezioni)':''));
    });
    copyText(lines.join('\n'));
  },
  copyLoading: function(evId){
    var ev = byId(db.events, evId); var plan = computeEventPlan(ev);
    var lines = ['Lista carico — '+(ev.name||'')+' ('+fmtDate(ev.date)+')',''];
    function block(title, items){ if(!items.length) return; lines.push(title); items.forEach(function(it){ lines.push('☐ '+it.ing.name+' — '+it.sub); }); lines.push(''); }
    block('🚚 FOOD TRUCK', plan.loading.truck);
    block('🚐 FURGONE', plan.loading.van);
    block('📦 COMUNE / DA ASSEGNARE', plan.loading.common);
    copyText(lines.join('\n'));
  },

  /* products */
  newProduct: function(){ state.draftProduct = {id:uid(), name:'', category:'', price:0, pct:0, recipe:[]}; nav('productForm', {}); },
  openProduct: function(id){
    var p = byId(db.products, id);
    state.draftProduct = Object.assign({}, p, { recipe:(p.recipe||[]).map(function(r){ return Object.assign({},r); }) });
    nav('productForm', {id:id});
  },
  cancelProductForm: function(){ state.draftProduct=null; nav('products'); },
  setProductField: function(field, val){ state.draftProduct[field]=val; },
  addRecipeRow: function(){ state.draftProduct.recipe.push({ingredientId:'',qty:0}); render(); },
  removeRecipeRow: function(i){ state.draftProduct.recipe.splice(i,1); render(); },
  setRecipeIngredient: function(i,val){ state.draftProduct.recipe[i].ingredientId=val; render(); },
  setRecipeQty: function(i,val){ state.draftProduct.recipe[i].qty=parseFloat(val)||0; },
  saveProduct: function(id){
    var d = state.draftProduct;
    if(!d.name || !d.name.trim()){ alert('Inserisci un nome per il prodotto.'); return; }
    var recipe = d.recipe.filter(function(r){return r.ingredientId;});
    var p = byId(db.products, id);
    if(!p){ p={id:id}; db.products.push(p); }
    p.name=d.name.trim(); p.price=d.price||0; p.pct=d.pct||0; p.category=(d.category||'').trim(); p.recipe=recipe;
    saveDB(); state.draftProduct=null;
    nav('products');
  },
  deleteProduct: function(id){
    if(!confirm('Eliminare questo prodotto? Verrà rimosso anche dai menu degli eventi che lo includono.')) return;
    db.products = db.products.filter(function(p){return p.id!==id;});
    db.events.forEach(function(ev){ ev.menu = (ev.menu||[]).filter(function(m){return m.productId!==id;}); });
    saveDB(); state.draftProduct=null; nav('products');
  },

  /* ingredients */
  newIngredient: function(){
    state.draftIngredient = {id:uid(), name:'', category:'', unit:'g', type:'consumable', location:'both', packageSize:null, alwaysRequired:false};
    nav('ingredientForm', {});
  },
  openIngredient: function(id){ state.draftIngredient = Object.assign({}, byId(db.ingredients, id)); nav('ingredientForm', {id:id}); },
  cancelIngredientForm: function(){ state.draftIngredient=null; nav('ingredients'); },
  setIngredientField: function(field, val, rerender){
    state.draftIngredient[field]=val;
    if(rerender) render();
  },
  saveIngredient: function(id){
    var d = state.draftIngredient;
    if(!d.name || !d.name.trim()){ alert('Inserisci un nome.'); return; }
    var i = byId(db.ingredients, id);
    if(!i){ i={id:id}; db.ingredients.push(i); }
    i.name=d.name.trim(); i.category=(d.category||'').trim(); i.type=d.type||'consumable'; i.location=d.location||'both';
    if(i.type==='equipment'){
      i.alwaysRequired = !!d.alwaysRequired;
      i.unit = i.unit || 'pz'; i.packageSize=null;
    } else {
      i.unit = (d.unit||'pz').trim() || 'pz';
      i.packageSize = d.packageSize ? parseFloat(d.packageSize) : null;
      i.alwaysRequired=false;
    }
    saveDB(); state.draftIngredient=null;
    nav('ingredients');
  },
  deleteIngredient: function(id){
    if(!confirm('Eliminare questo elemento? Verrà rimosso anche dalle ricette dei prodotti che lo usano.')) return;
    db.ingredients = db.ingredients.filter(function(i){return i.id!==id;});
    db.products.forEach(function(p){ p.recipe = (p.recipe||[]).filter(function(r){return r.ingredientId!==id;}); });
    saveDB(); state.draftIngredient=null; nav('ingredients');
  },

  /* sync */
  saveSheetUrl: function(){
    var u = document.getElementById('f-sheeturl').value.trim();
    if(!u){ cfg.sheetUrl=''; saveCfg(); toast('Collegamento rimosso'); render(); return; }
    if(!/^https:\/\/script\.google\.com\/.*\/exec$/.test(u)){
      if(!confirm('L\'indirizzo non sembra un URL Apps Script valido (deve finire con /exec). Salvarlo comunque?')) return;
    }
    connectSheet(u);
    toast('Collegamento salvato');
  },
  testSheet: function(){
    var u = document.getElementById('f-sheeturl').value.trim();
    if(!u){ toast('Inserisci prima l\'indirizzo'); return; }
    cfg.sheetUrl = u; saveCfg();
    toast('Invio di prova in corso…');
    postSheet({action:'ping'}).then(function(ok){ toast(ok? 'Connessione riuscita ✓' : 'Nessuna risposta dal foglio'); });
  },
  toggleAutoSync: function(checked){ cfg.auto=checked; saveCfg(); if(checked) queueAutoSync(); },
  pushNow: function(){ pushToSheet(false); },
  pullNow: function(){
    if(!confirm('Scaricare i dati dal foglio sovrascriverà i dati presenti su questo dispositivo. Continuare?')) return;
    pullFromSheet(false);
  },
  copyAppsScript: function(){ copyText(APPS_SCRIPT_CODE); },

  /* settings */
  exportData: function(){
    var blob = new Blob([JSON.stringify(db,null,2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var d = new Date().toISOString().slice(0,10);
    a.href=url; a.download='foodtruck-backup-'+d+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  },
  importData: function(file){
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var d = JSON.parse(reader.result);
        if(!d.ingredients || !d.products || !d.events) throw new Error('formato non valido');
        if(!confirm('Importando questo backup sovrascriverai tutti i dati attuali. Continuare?')) return;
        db = d; saveDB(); nav('events');
      }catch(e){ alert('File non valido: '+e.message); }
    };
    reader.readAsText(file);
  },
  resetAll: function(){
    if(!confirm('Cancellare TUTTI i dati (prodotti, ingredienti, eventi)? L\'azione non è reversibile.')) return;
    if(!confirm('Sei sicuro? Conviene esportare prima un backup.')) return;
    db = defaultDB(); saveDB(); nav('events');
  }
};

function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast('Copiato negli appunti'); }, function(){ fallbackCopy(text); });
  } else fallbackCopy(text);
}
function fallbackCopy(text){
  var ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand('copy'); toast('Copiato negli appunti'); }catch(e){ alert(text); }
  document.body.removeChild(ta);
}
function toast(msg){
  var t=document.createElement('div');
  t.textContent=msg;
  t.style.cssText='position:fixed;left:50%;bottom:calc(var(--navh) + 20px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:100px;font-size:13px;font-weight:700;z-index:100;box-shadow:var(--shadow)';
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 1800);
}

/* safety net: drop any in-progress draft when leaving its form */
var _origNav = nav;
nav = function(view, params){
  if(view!=='ingredientForm') state.draftIngredient=null;
  if(view!=='productForm') state.draftProduct=null;
  if(view!=='eventForm') state.draftEvent=null;
  _origNav(view, params);
};

render();
if(cfg.sheetUrl) pullFromSheet(true);
})();
</script>
