# Aggiornamenti automatici delle librerie: una proposta al mese, raggruppata,
# solo per versioni uscite da almeno 14 giorni (più stabili e più sicure).
version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      librerie:
        patterns: ['*']
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      azioni:
        patterns: ['*']
