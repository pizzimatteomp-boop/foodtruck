# Test automatici della super app VegMan (cartella app/).
# Parte a ogni modifica di app/ (push o pull request) e si può avviare a mano da GitHub > Actions.
name: Test app

on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/app-test.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/app-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Controllo tipi, test e sicurezza
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Installa le dipendenze (esattamente quelle del package-lock)
        run: npm ci --no-audit --no-fund

      - name: Controllo dei tipi (TypeScript)
        run: npm run typecheck

      - name: Test automatici con copertura minima (Vitest)
        run: npm run coverage

      - name: Pacchetto da pubblicare (build)
        run: npm run build

      - name: Riepilogo copertura
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const t=require('./coverage/coverage-summary.json').total;console.log('| Misura | Copertura |\n|---|---|\n'+['lines','functions','branches','statements'].map(k=>'| '+k+' | '+t[k].pct+'% |').join('\n'))" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Vulnerabilità note nelle librerie dell'app
        run: npm audit --omit=dev --audit-level=high

  regole:
    name: Regole del database (emulatore Firestore)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Emulatore in cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: emulatori-${{ hashFiles('app/package-lock.json') }}

      - name: Installa le dipendenze
        run: npm ci --no-audit --no-fund

      - name: Test delle regole per ruolo
        run: npm run test:regole

  # Pubblicazione su vegman-prova (https://vegman-prova.firebaseapp.com): schermate e regole del database.
  # Solo da main e solo se tutti i controlli sono passati. vegman-app (dati veri) NON viene toccato.
  pubblica-prova:
    name: Pubblica su vegman-prova
    needs: [test, regole]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pubblica-prova
      cancel-in-progress: false
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Installa le dipendenze
        run: npm ci --no-audit --no-fund

      - name: Pacchetto per l'ambiente di prova
        run: npm run build
        env:
          VITE_AMBIENTE: prova

      - name: Prepara la chiave
        env:
          CHIAVE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VEGMAN_PROVA }}
        run: |
          if [ -z "$CHIAVE" ]; then
            echo "::warning::Manca la chiave FIREBASE_SERVICE_ACCOUNT_VEGMAN_PROVA: pubblicazione saltata."
            exit 0
          fi
          printf '%s' "$CHIAVE" > "$RUNNER_TEMP/chiave.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/chiave.json" >> "$GITHUB_ENV"
          # Dati pubblici della chiave (non segreti): servono a capire con quale account si pubblica.
          jq -r '"Account: \(.client_email // "?") · progetto: \(.project_id // "?") · tipo: \(.type // "?")"' "$RUNNER_TEMP/chiave.json" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Pubblica le schermate
        if: env.GOOGLE_APPLICATION_CREDENTIALS != ''
        run: |
          npx firebase deploy --only hosting --project vegman-prova --non-interactive
          echo "Schermate pubblicate su https://vegman-prova.firebaseapp.com" >> "$GITHUB_STEP_SUMMARY"

      - name: Pubblica le regole del database
        if: env.GOOGLE_APPLICATION_CREDENTIALS != ''
        run: |
          npx firebase deploy --only firestore:rules --project vegman-prova --non-interactive
          echo "Regole del database pubblicate su vegman-prova" >> "$GITHUB_STEP_SUMMARY"

      - name: Cancella la chiave dal computer di GitHub
        if: always()
        run: rm -f "$RUNNER_TEMP/chiave.json"
