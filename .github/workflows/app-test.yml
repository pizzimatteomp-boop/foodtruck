# Test automatici della super app VegMan (cartella app/).
# Parte a ogni modifica di app/ (push o pull request) e si può avviare a mano da GitHub > Actions.
name: Test app

on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/app-test.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/app-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Controllo tipi, test e sicurezza
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Installa le dipendenze (esattamente quelle del package-lock)
        run: npm ci --no-audit --no-fund

      - name: Controllo dei tipi (TypeScript)
        run: npm run typecheck

      - name: Test automatici con copertura minima (Vitest)
        run: npm run coverage

      - name: Pacchetto da pubblicare (build)
        run: npm run build

      - name: Riepilogo copertura
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const t=require('./coverage/coverage-summary.json').total;console.log('| Misura | Copertura |\n|---|---|\n'+['lines','functions','branches','statements'].map(k=>'| '+k+' | '+t[k].pct+'% |').join('\n'))" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Vulnerabilità note nelle librerie dell'app
        run: npm audit --omit=dev --audit-level=high

  regole:
    name: Regole del database (emulatore Firestore)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Emulatore in cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: emulatori-${{ hashFiles('app/package-lock.json') }}

      - name: Installa le dipendenze
        run: npm ci --no-audit --no-fund

      - name: Test delle regole per ruolo
        run: npm run test:regole

  browser:
    name: Prova nel browser (accesso, ruoli, persone)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Emulatori in cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: emulatori-${{ hashFiles('app/package-lock.json') }}

      - name: Installa le dipendenze
        run: npm ci --no-audit --no-fund

      - name: Installa il browser di prova
        run: npx playwright install --with-deps chromium

      - name: Prova completa con gli emulatori
        run: npm run test:browser
        env:
          CI: true

  # App Android di cassa (Capacitor). Firmata con la chiave nei segreti di GitHub; senza chiave si controlla solo che si costruisca.
  # Da main l'APK firmato si scarica da GitHub > Actions > questa esecuzione > «VegMan-android».
  android:
    name: App Android (APK)
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Installa le dipendenze
        run: npm ci --no-audit --no-fund

      - name: Pacchetto per l'ambiente di prova e copia nel progetto Android
        run: npm run build && npx cap sync android
        env:
          VITE_AMBIENTE: prova

      - name: Prepara la chiave di firma
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$KP" ]; then
            echo "::warning::Manca la chiave di firma Android: costruisco solo la versione di controllo, niente APK da installare."
            exit 0
          fi
          printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/vegman.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/vegman.jks" >> "$GITHUB_ENV"

      - name: Costruisci l'APK
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_FILE" ]; then
            ./gradlew --no-daemon assembleRelease
            mkdir -p "$RUNNER_TEMP/apk" && cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/apk/VegMan-prova-${GITHUB_RUN_NUMBER}.apk"
            "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$RUNNER_TEMP/apk/"*.apk | grep -E "SHA-1|SHA-256" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - name: APK da scaricare
        if: env.ANDROID_KEYSTORE_FILE != '' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v5
        with:
          name: VegMan-android
          path: ${{ runner.temp }}/apk/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Cancella la chiave dal computer di GitHub
        if: always()
        run: rm -f "$RUNNER_TEMP/vegman.jks"

  # Pubblicazione su vegman-prova (https://vegman-prova.firebaseapp.com): schermate e regole del database.
  # Solo da main e solo se tutti i controlli sono passati. vegman-app (dati veri) NON viene toccato.
  pubblica-prova:
    name: Pubblica su vegman-prova
    needs: [test, regole, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pubblica-prova
      cancel-in-progress: false
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Installa le dipendenze
        run: npm ci --no-audit --no-fund

      - name: Pacchetto per l'ambiente di prova
        run: npm run build
        env:
          VITE_AMBIENTE: prova

      - name: Prepara la chiave
        env:
          CHIAVE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VEGMAN_PROVA }}
        run: |
          if [ -z "$CHIAVE" ]; then
            echo "::warning::Manca la chiave FIREBASE_SERVICE_ACCOUNT_VEGMAN_PROVA: pubblicazione saltata."
            exit 0
          fi
          printf '%s' "$CHIAVE" > "$RUNNER_TEMP/chiave.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/chiave.json" >> "$GITHUB_ENV"
          # Dati pubblici della chiave (non segreti): servono a capire con quale account si pubblica.
          jq -r '"Account: \(.client_email // "?") · progetto: \(.project_id // "?") · tipo: \(.type // "?")"' "$RUNNER_TEMP/chiave.json" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Pubblica le schermate
        if: env.GOOGLE_APPLICATION_CREDENTIALS != ''
        run: |
          npx firebase deploy --only hosting --project vegman-prova --non-interactive
          echo "Schermate pubblicate su https://vegman-prova.firebaseapp.com" >> "$GITHUB_STEP_SUMMARY"

      - name: Pubblica le regole del database
        if: env.GOOGLE_APPLICATION_CREDENTIALS != ''
        run: |
          npx firebase deploy --only firestore:rules --project vegman-prova --non-interactive
          echo "Regole del database pubblicate su vegman-prova" >> "$GITHUB_STEP_SUMMARY"

      - name: Cancella la chiave dal computer di GitHub
        if: always()
        run: rm -f "$RUNNER_TEMP/chiave.json"
