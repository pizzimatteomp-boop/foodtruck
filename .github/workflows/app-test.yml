# Test automatici della super app VegMan (cartella app/).
# Parte a ogni modifica di app/ (push o pull request) e si può avviare a mano da GitHub > Actions.
name: Test app

on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/app-test.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/app-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Controllo tipi e test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Installa le dipendenze
        run: npm ci

      - name: Controllo dei tipi (TypeScript)
        run: npm run typecheck

      - name: Test automatici (Vitest)
        run: npm test
